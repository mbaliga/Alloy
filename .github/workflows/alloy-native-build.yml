        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The last API-35 x86_64/ARM-translation boot exceeded the action's
          # 600-second default on a hosted Linux runner without usable KVM.
          emulator-boot-timeout: "1800"
          # Do not let the runner's optional post-boot animation settings
          # writes mask the native test result on slow hosted API-35 boots.
          disable-animations: false
          disable-linux-hw-accel: ${{ steps.emulator-acceleration.outputs.disable-hw-accel }}
          script: bash ci/run_native_release_instrumentation.sh
      - name: Export native G3 evidence through API-35 ARM translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The last API-35 x86_64/ARM-translation boot exceeded the action's
          # 600-second default on a hosted Linux runner without usable KVM.
          emulator-boot-timeout: "1800"
          # Keep this independent emulator boot free of optional ADB settings
          # mutations; the evidence harness is not animation-sensitive.
          disable-animations: false
          disable-linux-hw-accel: ${{ steps.emulator-acceleration.outputs.disable-hw-accel }}
          script: |
            # android-emulator-runner executes this value through /bin/sh.
            # Keep this POSIX-only: nesting a quoted Bash script causes the
            # action's own shell wrapper to terminate its string early.
            set -eu
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w -e class com.mbaliga.alloy.NativeEngineSmokeTest#exportsNativeG3EvidenceWhenRequested -e export-g3 true com.mbaliga.alloy.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p path-b-g3-evidence
            adb pull /sdcard/Android/data/com.mbaliga.alloy/files/alloy-g3-evidence/. path-b-g3-evidence/
            python3 ci/validate_g3_evidence.py path-b-g3-evidence
            test -s path-b-g3-evidence/overhang_support.gcode
            test -s path-b-g3-evidence/overhang_support.config.ini
      - uses: actions/upload-artifact@v4
        with:
          name: alloy-native-g3-evidence
          path: path-b-g3-evidence
          if-no-files-found: error
      - name: Compare native G3 output with exact-PR-head Orca reference
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALLOY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOY_PR_MERGE_SHA: ${{ github.sha }}
        run: |
          python3 ci/compare_g3_artifacts.py \
            --native-dir path-b-g3-evidence \
            --report-dir path-b-g3-parity
      - name: Upload native G3 semantic comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloy-native-desktop-g3-parity
          path: path-b-g3-parity
          if-no-files-found: warn
          retention-days: 14
      # A native test failure is the moment its JUnit XML is most valuable.
      # Keep it even when later success-only evidence artifacts are skipped.
      - name: Upload native instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloy-native-instrumentation-report
          path: |
            app/build/reports/androidTests/connected/release
            app/build/outputs/androidTest-results/connected/release
            native-instrumentation-diagnostics
          if-no-files-found: warn
          retention-days: 14
      # Produce the narrowly scoped physical-pilot variant only after the
      # ordinary native runtime/G3 gates have exercised their unmodified APKs.
      # This artifact remains explicitly unverified and may submit only the
      # five immutable A1 Mini / PLA Basic / no-support fixtures.
      - name: Build isolated A1 Mini physical-pilot APK pair
        run: |
          set -euxo pipefail
          gradle :app:assembleRelease :app:assembleReleaseAndroidTest \
            -PalloyNativeEngine=true \
            -PalloyPhysicalPilot=true \
            -PalloyCiDebugSign=true \
            --no-daemon --stacktrace
          mkdir -p path-a1-mini-pilot
          cp app/build/outputs/apk/release/app-release.apk path-a1-mini-pilot/app-release.apk
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk path-a1-mini-pilot/app-release-androidTest.apk
          aapt="${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"
          pilot_app_id=$("$aapt" dump badging path-a1-mini-pilot/app-release.apk | sed -n "1s/^package: name='\\([^']*\\)'.*/\\1/p")
          pilot_test_id=$("$aapt" dump badging path-a1-mini-pilot/app-release-androidTest.apk | sed -n "1s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$pilot_app_id" = "com.mbaliga.alloy.pilot"
          test "$pilot_test_id" = "com.mbaliga.alloy.pilot.test"
      - name: Run five-fixture pilot evidence on API-35 ARM translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The last API-35 x86_64/ARM-translation boot exceeded the action's
          # 600-second default on a hosted Linux runner without usable KVM.
          emulator-boot-timeout: "1800"
          disable-animations: false
          disable-linux-hw-accel: ${{ steps.emulator-acceleration.outputs.disable-hw-accel }}
          script: |
            set -eu
            adb install -r path-a1-mini-pilot/app-release.apk
            adb install -r path-a1-mini-pilot/app-release-androidTest.apk
