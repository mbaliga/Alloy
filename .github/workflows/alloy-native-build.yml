name: Alloy optional native engine build

on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle'
      - 'app/CMakeLists.txt'
      - 'app/CMakeLists.native.txt'
      - 'app/cmake/official-orca/FindOpenCV.cmake'
      - 'third_party/orca-official/**'
      - 'app/src/main/jni/**'
      - 'app/src/main/jniImports/**'
      - 'app/src/main/jniLibs/**'
      - 'app/src/main/occt/**'
      - '.gitmodules'
      - 'third_party/orca-deps-libnoise'
      - 'third_party/licenses/LIBNOISE_LGPL-2.1.txt'
      - 'app/src/main/java/com/mbaliga/alloy/NativeEngine.java'
      - 'app/src/main/java/com/mbaliga/alloy/NativeSlicerEngine.java'
      - 'app/src/main/java/com/mbaliga/alloy/Slicer.java'
      - 'app/src/main/java/com/mbaliga/alloy/ProfileCatalog.java'
      - 'app/src/main/java/com/mbaliga/alloy/PrinterCapabilityCatalog.java'
      # The native job executes the complete instrumentation suite. Any test
      # change can therefore invalidate its result, not only the native smoke
      # class itself.
      - 'app/src/androidTest/**'
      - 'app/src/androidTest/java/com/mbaliga/alloy/NativeEngineSmokeTest.java'
      - 'app/src/main/java/ru/ytkab0bp/slicebeam/slic3r/**'
      - 'ci/patch_orca_mobile_bootstrap.py'
      - 'ci/patch_boost_android_locale.py'
      - 'ci/test_patch_boost_android_locale.py'
      - 'ci/test_patch_orca_mobile_bootstrap.py'
      - 'ci/patch_slicebeam_stage1_no_step.py'
      - 'ci/validate_android_workflows.py'
      - 'ci/run_android_acceptance_with_diagnostics.sh'
      - 'ci/machine_template_probe_attempt.py'
      - 'ci/verify_machine_template_probe.py'
      - 'ci/validate_machine_template_probe_output.py'
      - 'ci/run_machine_template_probe.sh'
      - 'ci/compare_machine_template_probe.py'
      - 'ci/validate_profile_assets.py'
      - 'ci/validate_capability_catalog.py'
      - 'ci/validate_learning_assets.py'
      - 'docs/LEARNING_ASSET_MANIFEST.md'
      - 'ci/verify_profile_snapshot.py'
      - 'ci/export_a1mini_material_profiles.py'
      - 'ci/export_a1_p1s_material_profiles.py'
      - 'ci/validate_native_wiring.py'
      - 'ci/validate_official_orca_snapshot.py'
      - 'ci/export_official_orca_sources.py'
      - 'ci/test_export_official_orca_sources.py'
      - 'ci/validate_native_jni_contract.py'
      - 'ci/validate_native_dependency_inputs.py'
      - 'ci/normalize_occt_headers.py'
      - 'ci/validate_native_prebuilts.py'
      - 'ci/validate_g3_evidence.py'
      - 'ci/compare_g3_artifacts.py'
      - 'ci/g3_evidence_manifest.py'
      - 'ci/neutralize_bambu_motion_hooks.py'
      - 'ci/compare_hook_neutralized_g3.py'
      - 'parity/test_hook_neutralized_profile.py'
      - 'parity/test_hook_neutralized_g3.py'
      - 'parity/test_hook_neutralized_workflow_contract.py'
      - 'parity/test_g3_artifact_parity.py'
      - 'parity/test_g3_evidence_manifest.py'
      - 'parity/verify_g3_profile.py'
      - 'parity/test_g3_profile.py'
      - 'parity/compare_gcode.py'
      - 'parity/test_compare_gcode.py'
      - 'parity/test_machine_template_probe_output.py'
      - 'parity/test_machine_template_probe_script.py'
      - 'parity/test_machine_template_probe_diagnostic.py'
      - 'parity/test_android_acceptance_diagnostics.py'
      - 'ci/run_native_release_instrumentation.sh'
      - 'ci/build_gmp_mpfr_android.sh'
      - 'ci/native_build_provenance.py'
      - 'parity/test_native_build_provenance.py'
      - 'docs/GATE_STATUS.md'
      - 'docs/NATIVE_ENGINE_INTEGRATION.md'
      - 'docs/NATIVE_DEPENDENCIES.md'
      - '.github/workflows/alloy-native-build.yml'
  pull_request:
    paths:
      - 'app/build.gradle'
      - 'app/CMakeLists.txt'
      - 'app/CMakeLists.native.txt'
      - 'app/cmake/official-orca/FindOpenCV.cmake'
      - 'third_party/orca-official/**'
      - 'app/src/main/jni/**'
      - 'app/src/main/jniImports/**'
      - 'app/src/main/jniLibs/**'
      - 'app/src/main/occt/**'
      - '.gitmodules'
      - 'third_party/orca-deps-libnoise'
      - 'third_party/licenses/LIBNOISE_LGPL-2.1.txt'
      - 'app/src/main/java/com/mbaliga/alloy/NativeEngine.java'
      - 'app/src/main/java/com/mbaliga/alloy/NativeSlicerEngine.java'
      - 'app/src/main/java/com/mbaliga/alloy/Slicer.java'
      - 'app/src/main/java/com/mbaliga/alloy/ProfileCatalog.java'
      - 'app/src/main/java/com/mbaliga/alloy/PrinterCapabilityCatalog.java'
      # Keep pull-request evidence aligned with the entire suite as well.
      - 'app/src/androidTest/**'
      - 'app/src/androidTest/java/com/mbaliga/alloy/NativeEngineSmokeTest.java'
      - 'app/src/main/java/ru/ytkab0bp/slicebeam/slic3r/**'
      - 'ci/patch_orca_mobile_bootstrap.py'
      - 'ci/patch_boost_android_locale.py'
      - 'ci/test_patch_boost_android_locale.py'
      - 'ci/test_patch_orca_mobile_bootstrap.py'
      - 'ci/patch_slicebeam_stage1_no_step.py'
      - 'ci/validate_android_workflows.py'
      - 'ci/run_android_acceptance_with_diagnostics.sh'
      - 'ci/machine_template_probe_attempt.py'
      - 'ci/verify_machine_template_probe.py'
      - 'ci/validate_machine_template_probe_output.py'
      - 'ci/run_machine_template_probe.sh'
      - 'ci/compare_machine_template_probe.py'
      - 'ci/validate_profile_assets.py'
      - 'ci/validate_capability_catalog.py'
      - 'ci/validate_learning_assets.py'
      - 'docs/LEARNING_ASSET_MANIFEST.md'
      - 'ci/verify_profile_snapshot.py'
      - 'ci/export_a1mini_material_profiles.py'
      - 'ci/export_a1_p1s_material_profiles.py'
      - 'ci/validate_native_wiring.py'
      - 'ci/validate_official_orca_snapshot.py'
      - 'ci/export_official_orca_sources.py'
      - 'ci/test_export_official_orca_sources.py'
      - 'ci/validate_native_jni_contract.py'
      - 'ci/validate_native_dependency_inputs.py'
      - 'ci/normalize_occt_headers.py'
      - 'ci/validate_native_prebuilts.py'
      - 'ci/validate_g3_evidence.py'
      - 'ci/compare_g3_artifacts.py'
      - 'ci/g3_evidence_manifest.py'
      - 'ci/neutralize_bambu_motion_hooks.py'
      - 'ci/compare_hook_neutralized_g3.py'
      - 'parity/test_hook_neutralized_profile.py'
      - 'parity/test_hook_neutralized_g3.py'
      - 'parity/test_hook_neutralized_workflow_contract.py'
      - 'parity/test_g3_artifact_parity.py'
      - 'parity/test_g3_evidence_manifest.py'
      - 'parity/verify_g3_profile.py'
      - 'parity/test_g3_profile.py'
      - 'parity/compare_gcode.py'
      - 'parity/test_compare_gcode.py'
      - 'parity/test_machine_template_probe_output.py'
      - 'parity/test_machine_template_probe_script.py'
      - 'parity/test_machine_template_probe_diagnostic.py'
      - 'parity/test_android_acceptance_diagnostics.py'
      - 'ci/run_native_release_instrumentation.sh'
      - 'ci/build_gmp_mpfr_android.sh'
      - 'ci/native_build_provenance.py'
      - 'parity/test_native_build_provenance.py'
      - 'docs/GATE_STATUS.md'
      - 'docs/NATIVE_ENGINE_INTEGRATION.md'
      - 'docs/NATIVE_DEPENDENCIES.md'
      - '.github/workflows/alloy-native-build.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alloy-native-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  # Keep evidence-producing runs alive, but isolate each source revision so
  # a stalled emulator on an older commit cannot block validation of the
  # current candidate indefinitely.
  cancel-in-progress: false

env:
  SLICEBEAM_REPO: https://github.com/utkabobr/SliceBeam.git
  SLICEBEAM_SHA: 12b370ce305acc2caa59b7e4e78e04069db2f7e3
  ORCA_MOBILE_REPO: https://github.com/CodeMasterCody3D/OrcaSlicer-Mobile.git
  ORCA_MOBILE_SHA: d996a9cadb65b354997f2d5d8734b46bb9ea4efd
  ORCA_PROFILE_REPO: https://github.com/OrcaSlicer/OrcaSlicer.git
  ORCA_PROFILE_SHA: 07b81cfdc9e3933ee7cd8539d32bcf937f9d99b4
  BAMBU_PROFILE_REPO: https://github.com/bambulab/BambuStudio.git
  BAMBU_PROFILE_SHA: da8b44ee34dd349f2ae0df3f1cbae366df482354
  BAMBU_MATERIAL_PROFILE_SHA: 926a7192574bcb9b3a732e1ec59a46d79cb45466
  ANDROID_API: '35'
  NDK_VERSION: 23.1.7779620
  OPENCV_VERSION: 4.6.0
  OPENCV_SHA256: 1ec1cba65f9f20fe5a41fda1586e01c70ea0c9a6d7b67c9e13edf0cfe2239277

jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned official libnoise source
        shell: bash
        run: |
          set -euxo pipefail
          git submodule update --init --depth 1 third_party/orca-deps-libnoise
          python3 ci/validate_official_orca_snapshot.py \
            --libnoise-source-root third_party/orca-deps-libnoise
      - name: Initialize exact official Orca source for compile probe
        shell: bash
        run: |
          set -euxo pipefail
          git submodule update --init --depth 1 third_party/orca-official
          python3 ci/validate_official_orca_snapshot.py \
            --source-root third_party/orca-official \
            --libnoise-source-root third_party/orca-deps-libnoise
          python3 -m unittest -v ci.test_export_official_orca_sources ci.test_patch_boost_android_locale ci.test_patch_orca_mobile_bootstrap
      - name: Validate Android workflow variants
        run: python3 ci/validate_android_workflows.py
      - name: Test Bambu template probe evidence and failure collection
        run: PYTHONPATH=ci:parity python3 -B -m unittest -v parity/test_machine_template_probe_output.py parity/test_machine_template_probe_script.py parity/test_machine_template_probe_diagnostic.py parity/test_android_acceptance_diagnostics.py parity/test_native_build_provenance.py
      - name: Verify pinned Orca profile snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --sparse --no-checkout "$ORCA_PROFILE_REPO" orca-profile-source
          git -C orca-profile-source sparse-checkout set resources/profiles/BBL src/libslic3r/PrintConfig.cpp
          git -C orca-profile-source checkout --detach "$ORCA_PROFILE_SHA"
          test "$(git -C orca-profile-source rev-parse HEAD)" = "$ORCA_PROFILE_SHA"
          python3 ci/verify_profile_snapshot.py orca-profile-source app/src/main/assets/profiles/a1-mini-0.4-pla-basic.json
          python3 ci/export_a1mini_material_profiles.py orca-profile-source --check
          python3 ci/verify_profile_snapshot.py orca-profile-source app/src/main/assets/profiles/a1-mini-0.4-petg-basic.json
          python3 ci/verify_profile_snapshot.py orca-profile-source app/src/main/assets/profiles/a1-mini-0.4-petg-hf.json
          python3 ci/verify_profile_snapshot.py orca-profile-source app/src/main/assets/profiles/a1-mini-0.4-petg-translucent.json
          python3 ci/verify_profile_snapshot.py orca-profile-source app/src/main/assets/profiles/a1-mini-0.4-tpu-95a-hf.json
          python3 ci/verify_profile_snapshot.py orca-profile-source app/src/main/assets/profiles/a1-mini-0.4-pva.json
          python3 ci/verify_machine_template_probe.py orca-profile-source
      - name: Verify pinned Bambu planning profiles
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --sparse --no-checkout "$BAMBU_PROFILE_REPO" bambu-profile-source
          git -C bambu-profile-source sparse-checkout set resources/profiles/BBL
          git -C bambu-profile-source checkout --detach "$BAMBU_PROFILE_SHA"
          test "$(git -C bambu-profile-source rev-parse HEAD)" = "$BAMBU_PROFILE_SHA"
          python3 ci/verify_profile_snapshot.py bambu-profile-source app/src/main/assets/profiles/a1-0.4-pla-basic.json
          python3 ci/verify_profile_snapshot.py bambu-profile-source app/src/main/assets/profiles/p1s-0.4-pla-basic.json
          git clone --filter=blob:none --sparse --no-checkout "$BAMBU_PROFILE_REPO" bambu-material-profile-source
          git -C bambu-material-profile-source sparse-checkout set resources/profiles/BBL src/libslic3r/PrintConfig.cpp
          git -C bambu-material-profile-source checkout --detach "$BAMBU_MATERIAL_PROFILE_SHA"
          test "$(git -C bambu-material-profile-source rev-parse HEAD)" = "$BAMBU_MATERIAL_PROFILE_SHA"
          python3 ci/export_a1_p1s_material_profiles.py bambu-material-profile-source --check
          python3 ci/verify_profile_snapshot.py bambu-material-profile-source app/src/main/assets/profiles/a1-0.4-petg-basic.json
          python3 ci/verify_profile_snapshot.py bambu-material-profile-source app/src/main/assets/profiles/p1s-0.4-petg-hf.json
          python3 ci/verify_profile_snapshot.py bambu-material-profile-source app/src/main/assets/profiles/a1-0.4-tpu-95a.json
          python3 ci/verify_profile_snapshot.py bambu-material-profile-source app/src/main/assets/profiles/p1s-0.4-tpu-95a-hf.json
      - name: Validate native engine wiring
        run: |
          python3 ci/validate_native_wiring.py
          python3 ci/validate_native_jni_contract.py
          python3 ci/validate_native_prebuilts.py arm64-v8a
          python3 ci/validate_profile_assets.py
          python3 ci/validate_capability_catalog.py
          python3 ci/validate_learning_assets.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"
          for attempt in 1 2 3; do
            if sdkmanager --install "emulator" --channel=0; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android Emulator install failed after three attempts" >&2
              exit 1
            fi
            sleep 15
          done
          test -x "${ANDROID_SDK_ROOT}/emulator/emulator"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make ninja-build pkg-config python3 git curl unzip
      - name: Build Orca-pinned OpenCV for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/opencv/opencv/archive/refs/tags/${OPENCV_VERSION}.tar.gz" \
            --output opencv-${OPENCV_VERSION}.tar.gz
          echo "${OPENCV_SHA256}  opencv-${OPENCV_VERSION}.tar.gz" | sha256sum --check
          tar -xzf opencv-${OPENCV_VERSION}.tar.gz
          cmake -S "opencv-${OPENCV_VERSION}" -B opencv-build-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/opencv-install-arm64" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=core,highgui,imgcodecs,imgproc,world \
            -DBUILD_opencv_world=ON \
            -DBUILD_opencv_java=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DBUILD_ANDROID_PROJECTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_opencv_python2=OFF \
            -DBUILD_opencv_python3=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_LAPACK=OFF \
            -DWITH_EIGEN=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_GTK=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_OPENJPEG=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_V4L=OFF \
            -DWITH_WEBP=OFF \
            -DWITH_TBB=OFF \
            -DBUILD_TBB=OFF \
            -DBUILD_ZLIB=OFF \
            -DBUILD_PNG=ON \
            -DBUILD_JPEG=ON
          cmake --build opencv-build-arm64 --target opencv_world --parallel 2
          cmake --install opencv-build-arm64
          echo "ALLOY_OPENCV_ANDROID_ROOT=${GITHUB_WORKSPACE}/opencv-install-arm64/sdk/native" >> "$GITHUB_ENV"
      - name: Clone pinned SliceBeam source for dependency bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive "$SLICEBEAM_REPO" slicebeam
          git -C slicebeam checkout --detach "$SLICEBEAM_SHA"
          git -C slicebeam submodule update --init --recursive
          test "$(git -C slicebeam rev-parse HEAD)" = "$SLICEBEAM_SHA"
      - name: Clone pinned dependency bootstrap source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$ORCA_MOBILE_REPO" bootstrap-source
          git -C bootstrap-source checkout --detach "$ORCA_MOBILE_SHA"
          cp bootstrap-source/scripts/build_all_deps_android.sh slicebeam/build_all_deps_android.sh
          python3 ci/patch_orca_mobile_bootstrap.py slicebeam/build_all_deps_android.sh "$ANDROID_SDK_ROOT" "$ANDROID_NDK_ROOT" --boost-locale
          python3 ci/patch_slicebeam_stage1_no_step.py slicebeam
      - name: Build native dependencies from source
        working-directory: slicebeam
        shell: bash
        run: |
          set -euxo pipefail
          log_dir="${RUNNER_TEMP}/alloy-native-dependency-build"
          mkdir -p "$log_dir"
          log_file="$log_dir/build.log"
          printf 'started_at=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$log_dir/status.txt"
          set +e
          bash build_all_deps_android.sh 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          printf 'exit_status=%s\nfinished_at=%s\n' "$status" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$log_dir/status.txt"
          exit "$status"
      - name: Upload native dependency build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloy-native-dependency-build-diagnostics
          path: ${{ runner.temp }}/alloy-native-dependency-build/
          if-no-files-found: ignore
          retention-days: 14
      - name: Copy generated native inputs into Alloy
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniImports/boost app/src/main/jniImports/oneTBB
          cp -a slicebeam/app/src/main/jniImports/boost/. app/src/main/jniImports/boost/
          mkdir -p app/src/main/jniImports/boost/icu/arm64-v8a
          for library in libicui18n.a libicuuc.a libicudata.a; do
            cp "/tmp/build_android_deps/Boost-for-Android/libiconv-libicu-android/arm64-v8a/$library" app/src/main/jniImports/boost/icu/arm64-v8a/
          done
          iconv_root=/tmp/build_android_deps/Boost-for-Android/libiconv-libicu-android/arm64-v8a
          iconv_archive=""
          for candidate in "$iconv_root/lib/libiconv.a" "$iconv_root/lib32/libiconv.a" "$iconv_root/lib64/libiconv.a" "$iconv_root/libiconv-1.15/lib/.libs/libiconv.a"; do
            if [[ -s "$candidate" ]]; then
              iconv_archive="$candidate"
              break
            fi
          done
          test -n "$iconv_archive"
          cp "$iconv_archive" app/src/main/jniImports/boost/icu/arm64-v8a/libiconv.a
          cp -a slicebeam/app/src/main/jniImports/oneTBB/. app/src/main/jniImports/oneTBB/
          mkdir -p app/src/main/occt/include app/src/main/occt/jniLibs
          cp -a slicebeam/app/src/main/occt/include/. app/src/main/occt/include/
          cp -a slicebeam/app/src/main/occt/jniLibs/. app/src/main/occt/jniLibs/
          mkdir -p app/src/main/occt/src
          cp -a slicebeam/app/src/main/occt/src/. app/src/main/occt/src/
          python3 ci/normalize_occt_headers.py app/src/main/occt
      - name: Validate generated Alloy native inputs
        run: python3 ci/validate_native_dependency_inputs.py arm64-v8a --official-orca
      - name: Build GMP and MPFR from pinned official sources
        run: bash ci/build_gmp_mpfr_android.sh app/src/main arm64-v8a 26
      - name: Validate source-built GMP and MPFR inputs
        run: python3 ci/validate_native_prebuilts.py arm64-v8a --source-built
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
      - name: Build Alloy with the optional native engine
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease -PalloyNativeEngine=true -PalloyOfficialOrcaCompileProbe=true -PalloyCiDebugSign=true --no-daemon --stacktrace 2>&1 | tee native-engine-build.log
          build_status=${PIPESTATUS[0]}
          tail -n 250 native-engine-build.log > native-engine-build-tail.log
          exit "$build_status"

      - name: Upload native compile failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-build-diagnostic
          path: native-engine-build-tail.log
          if-no-files-found: error
          retention-days: 7
      - name: Compile native instrumentation smoke test
        run: gradle :app:assembleReleaseAndroidTest -PalloyNativeEngine=true -PalloyOfficialOrcaCompileProbe=true -PalloyCiDebugSign=true --no-daemon --stacktrace
      # Publish the exact APK pair before emulator startup so a runner boot
      # failure does not discard the source-built native binary evidence.
      - name: Upload native release APK before emulator validation
        uses: actions/upload-artifact@v4
        with:
          name: alloy-native-release-ci-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload native instrumentation APK before emulator validation
        uses: actions/upload-artifact@v4
        with:
          name: alloy-native-instrumentation-apk
          path: app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      # Use hosted KVM where available; some runner pools do not expose it.
      # In that case keep the test runnable with QEMU's software fallback.
      - name: Configure Android emulator acceleration
        id: emulator-acceleration
        shell: bash
        run: |
          set -euxo pipefail
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "disable-hw-accel=false" >> "$GITHUB_OUTPUT"
          else
            echo "disable-hw-accel=true" >> "$GITHUB_OUTPUT"
          fi
      # GitHub's Linux hosts are x86_64, and QEMU refuses an arm64 system image
      # there. API 35's Google APIs image provides ARM binary translation, so
      # this is an x86_64 *test host* that still installs and executes Alloy's
      # arm64-v8a JNI library. Do not add an x86 native ABI just to make CI
      # green: physical qualification remains arm64-v8a only.
      - name: Run native release instrumentation through API-35 ARM translation
        id: native_instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The last API-35 x86_64/ARM-translation boot exceeded the action's
          # 600-second default on a hosted Linux runner without usable KVM.
          emulator-boot-timeout: "1800"
          # Do not let the runner's optional post-boot animation settings
          # writes mask the native test result on slow hosted API-35 boots.
          disable-animations: false
          disable-linux-hw-accel: ${{ steps.emulator-acceleration.outputs.disable-hw-accel }}
          script: bash ci/run_native_release_instrumentation.sh
      # Keep an explicit attempt record even if the emulator action fails
      # before it can invoke its instrumentation script.
      - name: Initialize standalone Bambu template probe evidence
        if: always() && !cancelled()
        run: python3 ci/machine_template_probe_attempt.py path-b-template-probe initialized
      # Run the narrow probe independently so a failure in the broad suite
      # cannot prevent collection of template-rendering evidence.
      # Its artifact includes rendered/counterfactual-bbl/ separately from the
      # default-false and end-only renders.
      - name: Render pinned Bambu templates independently
        if: always() && !cancelled()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: "1800"
          disable-animations: false
          disable-linux-hw-accel: ${{ steps.emulator-acceleration.outputs.disable-hw-accel }}
          script: bash ci/run_machine_template_probe.sh
      # Compare default-false and test-only BBL-mode renders with the exact-PR-
      # head reference as a separate diagnostic. The BBL-mode output is
      # counterfactual/unqualified and never gates G3 or production behavior.
      - name: Compare Bambu template modes with exact-head reference (diagnostic only)
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALLOY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOY_PR_MERGE_SHA: ${{ github.sha }}
        run: |
          python3 ci/compare_machine_template_probe.py \
            --probe-dir path-b-template-probe/rendered \
            --report-dir path-b-template-probe-parity
      - name: Upload non-gating Bambu template comparison diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloy-bambu-template-probe-diagnostic
          path: path-b-template-probe-parity
          if-no-files-found: warn
          retention-days: 14
      - name: Export native G3 evidence through API-35 ARM translation
        if: always() && !cancelled()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The last API-35 x86_64/ARM-translation boot exceeded the action's
          # 600-second default on a hosted Linux runner without usable KVM.
          emulator-boot-timeout: "1800"
          # Keep this independent emulator boot free of optional ADB settings
          # mutations; the evidence harness is not animation-sensitive.
          disable-animations: false
          disable-linux-hw-accel: ${{ steps.emulator-acceleration.outputs.disable-hw-accel }}
          script: |
            # android-emulator-runner executes this value through /bin/sh.
            # Keep this POSIX-only: nesting a quoted Bash script causes the
            # action's own shell wrapper to terminate its string early.
            set -eu
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w -e class com.mbaliga.alloy.NativeEngineSmokeTest#exportsNativeG3EvidenceWhenRequested -e export-g3 true com.mbaliga.alloy.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p path-b-g3-evidence
            adb pull /sdcard/Android/data/com.mbaliga.alloy/files/alloy-g3-evidence/. path-b-g3-evidence/
            python3 ci/validate_g3_evidence.py path-b-g3-evidence
            test -s path-b-g3-evidence/overhang_support.gcode
            test -s path-b-g3-evidence/overhang_support.config.ini
      - name: Record native G3 run-context manifest
        if: always() && !cancelled() && github.event_name == 'pull_request'
        env:
          ALLOY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOY_PR_MERGE_SHA: ${{ github.sha }}
          ALLOY_RUN_ID: ${{ github.run_id }}
          ALLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 ci/g3_evidence_manifest.py \
            --evidence-dir path-b-g3-evidence \
            --head-sha "$ALLOY_PR_HEAD_SHA" \
            --base-sha "$ALLOY_PR_BASE_SHA" \
            --merge-sha "$ALLOY_PR_MERGE_SHA" \
            --run-id "$ALLOY_RUN_ID" \
            --run-attempt "$ALLOY_RUN_ATTEMPT"
      - name: Upload unqualified Bambu template rendering probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloy-bambu-template-rendering-probe
          path: path-b-template-probe
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: alloy-native-g3-evidence
          path: path-b-g3-evidence
          if-no-files-found: error
      - name: Compare native G3 output with exact-PR-head Orca reference
        if: always() && !cancelled() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALLOY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOY_PR_MERGE_SHA: ${{ github.sha }}
          ALLOY_RUN_ID: ${{ github.run_id }}
          ALLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 ci/compare_g3_artifacts.py \
            --native-dir path-b-g3-evidence \
            --report-dir path-b-g3-parity
      - name: Upload native G3 semantic comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloy-native-desktop-g3-parity
          path: path-b-g3-parity
          if-no-files-found: warn
          retention-days: 14
      # This counterfactual uses a separately sliced desktop reference with
      # profile motion hooks cleared and the normal hook-neutral native output.
      # It is deliberately non-gating and cannot replace strict G3.
      - name: Compare hook-neutralized G3 counterfactual (diagnostic only)
        if: always() && !cancelled() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALLOY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOY_PR_MERGE_SHA: ${{ github.sha }}
        run: |
          python3 ci/compare_hook_neutralized_g3.py \
            --native-dir path-b-g3-evidence \
            --report-dir path-b-hook-neutralized-g3-diagnostic \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$ALLOY_PR_HEAD_SHA" \
            --base-sha "$ALLOY_PR_BASE_SHA" \
            --merge-sha "$ALLOY_PR_MERGE_SHA" \
            --token "$GITHUB_TOKEN"
      - name: Upload hook-neutralized G3 counterfactual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloy-hook-neutralized-g3-counterfactual
          path: path-b-hook-neutralized-g3-diagnostic
          if-no-files-found: warn
          retention-days: 14
      # A native test failure is the moment its JUnit XML is most valuable.
      # Keep it even when later success-only evidence artifacts are skipped.
      - name: Upload native instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloy-native-instrumentation-report
          path: |
            app/build/reports/androidTests/connected/release
            app/build/outputs/androidTest-results/connected/release
            native-instrumentation-diagnostics
          if-no-files-found: warn
          retention-days: 14
      # This is a hash-bound inventory, never a source-lineage or legal PASS.
      # Run even when build/test steps fail so partial native evidence survives.
      - name: Record native build provenance inventory
        if: always()
        env:
          ALLOY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          python3 ci/native_build_provenance.py \
            --repo-root . \
            --slice-beam-root slicebeam \
            --bootstrap-root bootstrap-source \
            --output path-native-provenance/manifest.json
          python3 ci/native_build_provenance.py \
            --repo-root . \
            --validate path-native-provenance/manifest.json
      - name: Upload native build provenance inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alloy-native-build-provenance-inventory
          path: path-native-provenance
          if-no-files-found: warn
          retention-days: 30
      # Collect narrowly scoped physical-pilot evidence after native runtime
      # instrumentation passes, even when strict G3 fails. The G3 failure still
      # fails this workflow; this CI-debug artifact remains unqualified and can
      # submit only the five immutable A1 Mini / PLA Basic / no-support fixtures.
      - name: Build isolated A1 Mini physical-pilot APK pair
        if: always() && !cancelled() && steps.native_instrumentation.outcome == 'success'
        id: pilot_apk
        run: |
          set -euxo pipefail
          gradle :app:assembleRelease :app:assembleReleaseAndroidTest \
            -PalloyNativeEngine=true \
            -PalloyPhysicalPilot=true \
            -PalloyCiDebugSign=true \
            --no-daemon --stacktrace
          mkdir -p path-a1-mini-pilot
          cp app/build/outputs/apk/release/app-release.apk path-a1-mini-pilot/app-release.apk
          cp app/build/outputs/apk/androidTest/release/app-release-androidTest.apk path-a1-mini-pilot/app-release-androidTest.apk
          aapt="${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"
          pilot_app_id=$("$aapt" dump badging path-a1-mini-pilot/app-release.apk | sed -n "1s/^package: name='\\([^']*\\)'.*/\\1/p")
          pilot_test_id=$("$aapt" dump badging path-a1-mini-pilot/app-release-androidTest.apk | sed -n "1s/^package: name='\\([^']*\\)'.*/\\1/p")
          test "$pilot_app_id" = "com.mbaliga.alloy.pilot"
          test "$pilot_test_id" = "com.mbaliga.alloy.pilot.test"
      - name: Run five-fixture pilot evidence on API-35 ARM translation
        if: always() && !cancelled() && steps.native_instrumentation.outcome == 'success' && steps.pilot_apk.outcome == 'success'
        id: pilot_evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The last API-35 x86_64/ARM-translation boot exceeded the action's
          # 600-second default on a hosted Linux runner without usable KVM.
          emulator-boot-timeout: "1800"
          disable-animations: false
          disable-linux-hw-accel: ${{ steps.emulator-acceleration.outputs.disable-hw-accel }}
          script: |
            set -eu
            adb install -r path-a1-mini-pilot/app-release.apk
            adb install -r path-a1-mini-pilot/app-release-androidTest.apk
            adb shell am instrument -w -e class com.mbaliga.alloy.NoSupportPlaPilotTest#nativeNoSupportPilotFixturesRemainInspectableAndPackageable -e export-no-support-pilot true com.mbaliga.alloy.pilot.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p path-a1-mini-pilot/evidence
            adb pull /sdcard/Android/data/com.mbaliga.alloy.pilot/files/alloy-no-support-pilot/. path-a1-mini-pilot/evidence/
            python3 -c 'import json,pathlib,re; files=list(pathlib.Path("path-a1-mini-pilot/evidence").glob("run-*/software-pilot-manifest.json")); assert len(files)==1, "expected one software pilot manifest"; data=json.loads(files[0].read_text()); expected={"box-20mm.stl","mounting-block.stl","thin-wall-frame-fixture.stl","travel_obstacle.stl","box-and-lid.stl"}; fixtures=data.get("fixtures",[]); assert data.get("software_only") is True and data.get("physical_qualification")=="PENDING" and data.get("direct_send_qualification")=="PENDING"; assert {f.get("fixture") for f in fixtures}==expected; assert all(f.get("supports") is False and f.get("package_preflight")=="PASS" and re.fullmatch(r"[0-9a-f]{64}",f.get("package_sha256","")) for f in fixtures); print("validated five-fixture software-only A1 Mini pilot evidence")'
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled() && steps.native_instrumentation.outcome == 'success' && steps.pilot_apk.outcome == 'success'
        with:
          name: alloy-a1-mini-physical-pilot-ci
          path: path-a1-mini-pilot
          if-no-files-found: error
