name: Desktop Orca A1 Mini reference slices

on:
  push:
    branches: [stage1-runtime-parity]
    paths:
      - '.github/workflows/desktop-orca-reference.yml'
      - 'parity/export_resolved_orca_profiles.py'
      - 'parity/test_export_resolved_orca_profiles.py'
      - 'parity/generate_fixtures.py'
      - 'parity/test_generate_fixtures.py'
      - 'parity/compare_gcode.py'
      - 'parity/test_compare_gcode.py'
      - 'ci/neutralize_bambu_motion_hooks.py'
      - 'ci/prepare_orca_cli_process_profile.py'
      - 'ci/compare_hook_neutralized_g3.py'
      - 'ci/compare_g3_artifacts.py'
      - 'ci/validate_g3_reference_transform.py'
      - 'parity/test_hook_neutralized_profile.py'
      - 'parity/test_hook_neutralized_g3.py'
      - 'parity/test_hook_neutralized_workflow_contract.py'
      - 'app/src/main/assets/models/**'
      - 'parity/test_desktop_orca_reference_workflow.py'
      - 'parity/test_prepare_orca_cli_process_profile.py'
      - 'parity/g3-bambu-filament-overlay.json'
      - 'app/src/androidTest/assets/profiles/g3-bambu-a1mini-project-settings.json'
      - 'parity/verify_gcode_3mf.py'
  pull_request:
    branches: [stage1-gates-prep, codex/fix-native-test-status]
    paths:
      - '.github/workflows/desktop-orca-reference.yml'
      - 'parity/export_resolved_orca_profiles.py'
      - 'parity/test_export_resolved_orca_profiles.py'
      - 'parity/generate_fixtures.py'
      - 'parity/test_generate_fixtures.py'
      - 'parity/compare_gcode.py'
      - 'parity/test_compare_gcode.py'
      - 'ci/neutralize_bambu_motion_hooks.py'
      - 'ci/prepare_orca_cli_process_profile.py'
      - 'ci/compare_hook_neutralized_g3.py'
      - 'ci/compare_g3_artifacts.py'
      - 'ci/validate_g3_reference_transform.py'
      - 'parity/test_hook_neutralized_profile.py'
      - 'parity/test_hook_neutralized_g3.py'
      - 'parity/test_hook_neutralized_workflow_contract.py'
      - 'app/src/main/assets/models/**'
      - 'parity/test_desktop_orca_reference_workflow.py'
      - 'parity/test_prepare_orca_cli_process_profile.py'
      - 'parity/g3-bambu-filament-overlay.json'
      - 'app/src/androidTest/assets/profiles/g3-bambu-a1mini-project-settings.json'
      - 'parity/verify_gcode_3mf.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORCA_REPO: https://github.com/OrcaSlicer/OrcaSlicer.git
  ORCA_PROFILE_SHA: 07b81cfdc9e3933ee7cd8539d32bcf937f9d99b4
  ORCA_VERSION: 2.4.2
  ORCA_APPIMAGE_URL: https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.4.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.4.2.AppImage

jobs:
  reference-slices:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic G3 geometry
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/generate_fixtures.py --out runtime/fixtures
          sha256sum runtime/fixtures/*.stl | tee runtime/fixtures/SHA256SUMS
          python3 -m unittest discover -s parity -p 'test_generate_fixtures.py' -v

      - name: Clone pinned Orca profile snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$ORCA_REPO" orca-profiles
          git -C orca-profiles checkout --detach "$ORCA_PROFILE_SHA"
          test "$(git -C orca-profiles rev-parse HEAD)" = "$ORCA_PROFILE_SHA"

      - name: Flatten pinned A1 Mini profiles
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/export_resolved_orca_profiles.py orca-profiles runtime/profiles
          sha256sum runtime/profiles/*.json | tee runtime/profiles/SHA256SUMS

      - name: Install AppImage host OpenGL runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglu1-mesa libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0

      - name: Download and extract OrcaSlicer 2.4.2 AppImage
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/orca
          curl -L --fail --retry 3 -o runtime/orca/OrcaSlicer.AppImage "$ORCA_APPIMAGE_URL"
          chmod +x runtime/orca/OrcaSlicer.AppImage
          sha256sum runtime/orca/OrcaSlicer.AppImage | tee runtime/orca/SHA256SUMS
          (
            cd runtime/orca
            ./OrcaSlicer.AppImage --appimage-extract >/dev/null
          )
          test -x runtime/orca/squashfs-root/AppRun

      - name: Capture Orca CLI help/version evidence
        shell: bash
        run: |
          set -euxo pipefail
          ORCA="$GITHUB_WORKSPACE/runtime/orca/squashfs-root/AppRun"
          mkdir -p runtime/evidence
          "$ORCA" --help > runtime/evidence/orca-help.txt 2>&1 || true
          head -n 120 runtime/evidence/orca-help.txt || true
          grep -E -- '--load-settings|--load-filaments|--slice|--export-3mf' runtime/evidence/orca-help.txt || true

      - name: Slice all three fixtures with pinned A1 Mini profiles
        shell: bash
        run: |
          set -euxo pipefail
          ORCA="$GITHUB_WORKSPACE/runtime/orca/squashfs-root/AppRun"
          MACHINE="$GITHUB_WORKSPACE/runtime/profiles/machine.json"
          # Keep the exact Bambu project settings as the source of truth.
          # Normalize its "from: project" provenance only for Orca CLI; all
          # print-setting values remain unchanged.
          PROJECT_SETTINGS="$GITHUB_WORKSPACE/app/src/androidTest/assets/profiles/g3-bambu-a1mini-project-settings.json"
          COMPATIBILITY_PROFILE="$GITHUB_WORKSPACE/runtime/profiles/process.json"
          PROCESS="$GITHUB_WORKSPACE/runtime/profiles/g3-project-process.json"
          python3 ci/prepare_orca_cli_process_profile.py "$PROJECT_SETTINGS" "$COMPATIBILITY_PROFILE" "$PROCESS"
          FILAMENT="$GITHUB_WORKSPACE/parity/g3-bambu-filament-overlay.json"
          mkdir -p runtime/orca-reference

          for stl in runtime/fixtures/*.stl; do
            name="$(basename "$stl" .stl)"
            out="$GITHUB_WORKSPACE/runtime/orca-reference/$name"
            mkdir -p "$out"
            "$ORCA" \
              --debug 2 \
              --arrange 1 \
              --slice 0 \
              --load-settings "$MACHINE;$PROCESS" \
              --load-filaments "$FILAMENT" \
              --allow-newer-file \
              --outputdir "$out" \
              --export-3mf "$name.gcode.3mf" \
              "$GITHUB_WORKSPACE/$stl" \
              > "$out/orca.log" 2>&1

            python3 parity/verify_gcode_3mf.py "$out/$name.gcode.3mf"
          done

      # A1/P1S source-profile references are intentionally diagnostic only.
      # Their printer-native app recipes are not yet paired with equivalent
      # desktop project settings, so no estimate-parity result is inferred.
      - name: Slice A1 and P1S profile references (diagnostic only)
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          ORCA="$GITHUB_WORKSPACE/runtime/orca/squashfs-root/AppRun"
          python3 parity/export_resolved_orca_profiles.py "$GITHUB_WORKSPACE/orca-profiles" runtime/multimodel-profiles --printer a1 --printer p1s
          mkdir -p runtime/orca-reference-multimodel
          : > runtime/evidence/multimodel-reference-errors.txt
          for printer in a1 p1s; do
            profile_dir="$GITHUB_WORKSPACE/runtime/multimodel-profiles/$printer"
            out_root="$GITHUB_WORKSPACE/runtime/orca-reference-multimodel/$printer"
            mkdir -p "$out_root"
            verified_count=0
            for stl in runtime/fixtures/*.stl; do
              name="$(basename "$stl" .stl)"
              out="$out_root/$name"
              mkdir -p "$out"
              if ! "$ORCA" \
                --debug 2 \
                --arrange 1 \
                --slice 0 \
                --load-settings "$profile_dir/machine.json;$profile_dir/process.json" \
                --load-filaments "$profile_dir/filament.json" \
                --allow-newer-file \
                --outputdir "$out" \
                --export-3mf "$name.gcode.3mf" \
                "$GITHUB_WORKSPACE/$stl" \
                > "$out/orca.log" 2>&1; then
                echo "Slice failed: $printer / $name" | tee -a runtime/evidence/multimodel-reference-errors.txt
                continue
              fi
              if ! python3 parity/verify_gcode_3mf.py "$out/$name.gcode.3mf"; then
                echo "3MF verification failed: $printer / $name" | tee -a runtime/evidence/multimodel-reference-errors.txt
              else
                verified_count=$((verified_count + 1))
              fi
            done
            if [ "$verified_count" -eq 4 ]; then
              echo "$printer: complete ($verified_count/4 verified fixtures)" | tee -a runtime/evidence/multimodel-reference-errors.txt
            elif [ "$verified_count" -eq 0 ]; then
              echo "$printer: unavailable (0/4 verified fixtures)" | tee -a runtime/evidence/multimodel-reference-errors.txt
            else
              echo "$printer: partial ($verified_count/4 verified fixtures)" | tee -a runtime/evidence/multimodel-reference-errors.txt
            fi
          done
          {
            echo "Purpose: diagnostic reference slices only; not a parity gate or print qualification"
            echo "Orca profile source: ${ORCA_PROFILE_SHA}"
            echo "A1 mapping: Bambu Lab A1 0.4 nozzle / 0.20mm Standard @BBL A1 / Bambu PLA Basic @BBL A1"
            echo "P1S mapping: Bambu Lab P1S 0.4 nozzle / 0.20mm Standard @BBL X1C / Bambu PLA Basic @BBL X1C"
            echo "P1S process and filament leaves are the exact compatible leaves in this pinned snapshot"
            echo "These default profile slices are not compared with native output until settings are explicitly aligned"
            echo "Resolved profile file hashes:"
            sha256sum runtime/multimodel-profiles/*/*.json
            echo "Per-printer status and errors:"
            cat runtime/evidence/multimodel-reference-errors.txt
            find runtime/orca-reference-multimodel -type f -name '*.gcode.3mf' -print0 | xargs -0 -r sha256sum
          } > runtime/evidence/multimodel-reference-manifest.txt

      # This separately named lane is only a counterfactual for isolating the
      # effect of profile motion hooks. It does not replace or modify the
      # strict reference slices above.
      - name: Slice hook-neutralized counterfactual fixtures (diagnostic only)
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          ORCA="$GITHUB_WORKSPACE/runtime/orca/squashfs-root/AppRun"
          SOURCE_MACHINE="$GITHUB_WORKSPACE/runtime/profiles/machine.json"
          NEUTRAL_DIR="$GITHUB_WORKSPACE/runtime/profiles/hook-neutralized"
          python3 ci/neutralize_bambu_motion_hooks.py "$SOURCE_MACHINE" "$NEUTRAL_DIR"
          MACHINE="$NEUTRAL_DIR/machine-hooks-neutralized.json"
          PROJECT_SETTINGS="$GITHUB_WORKSPACE/app/src/androidTest/assets/profiles/g3-bambu-a1mini-project-settings.json"
          COMPATIBILITY_PROFILE="$GITHUB_WORKSPACE/runtime/profiles/process.json"
          PROCESS="$GITHUB_WORKSPACE/runtime/profiles/g3-project-process-hook-neutralized.json"
          python3 ci/prepare_orca_cli_process_profile.py "$PROJECT_SETTINGS" "$COMPATIBILITY_PROFILE" "$PROCESS" --neutralize-motion-hooks
          FILAMENT="$GITHUB_WORKSPACE/parity/g3-bambu-filament-overlay.json"
          mkdir -p runtime/orca-reference-hook-neutralized
          for stl in runtime/fixtures/*.stl; do
            name="$(basename "$stl" .stl)"
            out="$GITHUB_WORKSPACE/runtime/orca-reference-hook-neutralized/$name"
            mkdir -p "$out"
            "$ORCA" \
              --debug 2 \
              --arrange 1 \
              --slice 0 \
              --load-settings "$MACHINE;$PROCESS" \
              --load-filaments "$FILAMENT" \
              --allow-newer-file \
              --outputdir "$out" \
              --export-3mf "$name.gcode.3mf" \
              "$GITHUB_WORKSPACE/$stl" \
              > "$out/orca.log" 2>&1
            python3 parity/verify_gcode_3mf.py "$out/$name.gcode.3mf"
          done

      - name: Record authoritative baseline manifest
        shell: bash
        env:
          ALLOY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALLOY_PR_MERGE_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          {
            echo "OrcaSlicer release: v${ORCA_VERSION}"
            echo "Orca profile source: ${ORCA_PROFILE_SHA}"
            echo "PR head SHA: ${ALLOY_PR_HEAD_SHA:-not-applicable}"
            echo "PR base SHA: ${ALLOY_PR_BASE_SHA:-not-applicable}"
            echo "PR merge SHA: ${ALLOY_PR_MERGE_SHA:-not-applicable}"
            echo "Machine: Bambu Lab A1 mini 0.4 nozzle"
            echo "Process: Alloy checked-in G3 project recipe"
            echo "Filament: Alloy checked-in G3 PLA overlay"
            echo
            sha256sum runtime/orca-reference/*/*.gcode.3mf
          } > runtime/evidence/reference-manifest.txt
          cat runtime/evidence/reference-manifest.txt

      - name: Upload Orca reference slices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a1mini-orca-2.4.2-reference-slices
          path: |
            runtime/orca-reference
            runtime/orca-reference-hook-neutralized
            runtime/orca-reference-multimodel
            runtime/multimodel-profiles
            runtime/profiles
            runtime/profiles/hook-neutralized
            runtime/fixtures/SHA256SUMS
            runtime/orca/SHA256SUMS
            runtime/evidence
          if-no-files-found: error
