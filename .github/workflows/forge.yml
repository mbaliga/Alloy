name: Forge

# Alloy Forge (forge/): headless tests and the production build. The browser smoke tests (npm run test:ui,
# test:ext-ui) need Playwright and a browser and are run by hand; see forge/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'forge/**'
      - 'runner/**'
      - '.github/workflows/forge.yml'
  pull_request:
    paths:
      - 'forge/**'
      - 'runner/**'
      - '.github/workflows/forge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: forge

jobs:
  test-and-build:
    name: npm test and npm run build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge/package-lock.json
      - name: Install (node_modules is not committed)
        run: npm ci
      - name: Headless tests (kernel, design loop, selection actions, OCCT)
        run: npm test
      - name: Analysis validation suite (a missed tolerance fails the build)
        run: npm run test:analysis
      - name: Production build
        run: npm run build
      - name: The build produced the app and the OCCT kernel files
        run: |
          set -eu
          for f in dist/index.html dist/app.js dist/occt-worker.js dist/occt/replicad_single.wasm dist/occt-import-js.wasm; do
            test -s "$f" || { echo "missing build output: $f"; exit 1; }
          done
          ls -l dist | head -20

  # The Alloy Runner (runner/): its tests use the real gmsh from Ubuntu's archive for meshing and a simulated solver for the protocol.
  # No Elmer is installed here, so nothing in this job validates a solver result.
  runner:
    name: Alloy Runner tests (gmsh, simulated solver)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gmsh (meshing step; GPL, run as a separate process)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gmsh
      - name: Runner tests
        run: npm test
