name: G1 OrcaSlicer-Mobile source build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/g1-orca-mobile-source-build.yml'
      - 'ci/**'
      - 'docs/UPSTREAM_EVALUATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alloy-g1-${{ github.ref }}
  cancel-in-progress: true

env:
  ORCA_MOBILE_REPO: https://github.com/CodeMasterCody3D/OrcaSlicer-Mobile.git
  ORCA_MOBILE_SHA: d996a9cadb65b354997f2d5d8734b46bb9ea4efd
  ANDROID_API: '35'
  NDK_VERSION: 23.1.7779620

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Alloy gate scripts
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 and NDK
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make ninja-build pkg-config python3 git curl unzip

      - name: Clone pinned OrcaSlicer-Mobile source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive "$ORCA_MOBILE_REPO" upstream
          cd upstream
          git checkout --detach "$ORCA_MOBILE_SHA"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$ORCA_MOBILE_SHA"
          git status --short

      - name: Make upstream dependency bootstrap portable
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream
          python3 "$GITHUB_WORKSPACE/ci/patch_orca_mobile_bootstrap.py" \
            scripts/build_all_deps_android.sh \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_NDK_ROOT"
          grep -n "ANDROID_SDK_ROOT\|ANDROID_NDK_ROOT" scripts/build_all_deps_android.sh

      - name: Build missing Android native dependencies from source
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream
          bash scripts/build_all_deps_android.sh

      - name: Verify imported native dependency set
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream
          python3 scripts/check-native-prebuilts.py arm64-v8a

      - name: Build OrcaSlicer-Mobile native debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Record build evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p g1-evidence
          {
            echo "OrcaSlicer-Mobile: ${ORCA_MOBILE_SHA}"
            echo "Android API: ${ANDROID_API}"
            echo "NDK: ${NDK_VERSION}"
            if [ -d upstream ]; then
              echo "Resolved upstream: $(git -C upstream rev-parse HEAD 2>/dev/null || true)"
              echo "Working tree:"
              git -C upstream status --short || true
            fi
          } > g1-evidence/build.txt
          find upstream/app/build/outputs/apk -type f -name '*.apk' -print 2>/dev/null >> g1-evidence/build.txt || true

      - name: Upload G1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-source-build-evidence
          path: g1-evidence
          if-no-files-found: error

      - name: Upload built APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orcaslicer-mobile-g1-apk
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
