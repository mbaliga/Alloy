name: Official Orca Android OpenCV dependency

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/official-orca-opencv-android.yml'
      - 'third_party/orca-official/deps/OpenCV/**'
      - 'third_party/orca-official/src/libslic3r/ObjColorUtils.hpp'
      - 'ci/fixtures/official-orca-opencv-smoke.cpp'
      - 'ci/fixtures/official-orca-opencv-consumer/**'
  pull_request:
    paths:
      - '.github/workflows/official-orca-opencv-android.yml'
      - 'third_party/orca-official/deps/OpenCV/**'
      - 'third_party/orca-official/src/libslic3r/ObjColorUtils.hpp'
      - 'ci/fixtures/official-orca-opencv-smoke.cpp'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: '23'
  NDK_VERSION: 23.1.7779620
  OPENCV_VERSION: 4.6.0
  OPENCV_SHA256: 1ec1cba65f9f20fe5a41fda1586e01c70ea0c9a6d7b67c9e13edf0cfe2239277

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Download and verify Orca-pinned OpenCV source
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/opencv/opencv/archive/refs/tags/${OPENCV_VERSION}.tar.gz" \
            --output opencv-${OPENCV_VERSION}.tar.gz
          echo "${OPENCV_SHA256}  opencv-${OPENCV_VERSION}.tar.gz" | sha256sum --check
          tar -xzf opencv-${OPENCV_VERSION}.tar.gz

      - name: Configure OpenCV for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S "opencv-${OPENCV_VERSION}" -B opencv-build-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/opencv-install-arm64" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_LIST=core,highgui,imgcodecs,imgproc,world \
            -DBUILD_opencv_world=ON \
            -DBUILD_opencv_java=OFF \
            -DBUILD_ANDROID_EXAMPLES=OFF \
            -DBUILD_ANDROID_PROJECTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_opencv_python2=OFF \
            -DBUILD_opencv_python3=OFF \
            -DWITH_OPENCL=OFF \
            -DWITH_LAPACK=OFF \
            -DWITH_EIGEN=OFF \
            -DWITH_FFMPEG=OFF \
            -DWITH_GSTREAMER=OFF \
            -DWITH_GTK=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_OPENJPEG=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_V4L=OFF \
            -DWITH_WEBP=OFF \
            -DWITH_TBB=OFF \
            -DBUILD_TBB=OFF \
            -DBUILD_ZLIB=OFF \
            -DBUILD_PNG=ON \
            -DBUILD_JPEG=ON

      - name: Build and install pinned OpenCV world library
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build opencv-build-arm64 --target opencv_world --parallel 2
          cmake --install opencv-build-arm64
          find opencv-install-arm64 -type f -name 'libopencv_world.a' -print -quit | grep -q .
          test -f opencv-install-arm64/sdk/native/jni/include/opencv2/opencv.hpp

      - name: Compile smoke fixture against official Orca color utility
        shell: bash
        run: |
          set -euxo pipefail
          "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API}-clang++" \
            -std=c++17 -fsyntax-only \
            -Ithird_party/orca-official/src/libslic3r \
            -Iopencv-install-arm64/sdk/native/jni/include \
            ci/fixtures/official-orca-opencv-smoke.cpp

      - name: Configure and link an Orca-style OpenCV consumer
        shell: bash
        run: |
          set -euxo pipefail
          OPENCV_CONFIG="$(find opencv-install-arm64 -name OpenCVConfig.cmake -print -quit)"
          test -n "${OPENCV_CONFIG}"
          cmake -S ci/fixtures/official-orca-opencv-consumer \
            -B opencv-consumer-build-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DOpenCV_DIR="$(dirname "${OPENCV_CONFIG}")" \
            -DORCA_SOURCE_DIR="${GITHUB_WORKSPACE}/third_party/orca-official"
          cmake --build opencv-consumer-build-arm64 --parallel 2

      - uses: actions/upload-artifact@v4
        with:
          name: official-orca-opencv-4.6.0-android-arm64
          path: opencv-install-arm64
          if-no-files-found: error
