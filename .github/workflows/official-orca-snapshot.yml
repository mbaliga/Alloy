name: Official Orca source snapshot

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.gitmodules'
      - 'third_party/orca-official'
      - 'third_party/orca-deps-libnoise'
      - 'third_party/licenses/LIBNOISE_LGPL-2.1.txt'
      - 'third_party/ORCA_OFFICIAL_SNAPSHOT.md'
      - 'app/cmake/official-orca/**'
      - 'ci/test_official_orca_libnoise_adapter.py'
      - 'ci/fixtures/official-orca-libnoise-adapter/**'
      - 'ci/validate_official_orca_snapshot.py'
      - 'ci/audit_official_orca_port_surface.py'
      - 'ci/test_official_orca_port_surface.py'
      - '.github/workflows/official-orca-snapshot.yml'
      - 'docs/OFFICIAL_ORCA_G2_PORT_PLAN.md'
  pull_request:
    paths:
      - '.gitmodules'
      - 'third_party/orca-official'
      - 'third_party/orca-deps-libnoise'
      - 'third_party/licenses/LIBNOISE_LGPL-2.1.txt'
      - 'third_party/ORCA_OFFICIAL_SNAPSHOT.md'
      - 'app/cmake/official-orca/**'
      - 'ci/test_official_orca_libnoise_adapter.py'
      - 'ci/fixtures/official-orca-libnoise-adapter/**'
      - 'ci/validate_official_orca_snapshot.py'
      - 'ci/audit_official_orca_port_surface.py'
      - 'ci/test_official_orca_port_surface.py'
      - '.github/workflows/official-orca-snapshot.yml'
      - 'docs/OFFICIAL_ORCA_G2_PORT_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned official source snapshot
        run: >-
          python3 ci/validate_official_orca_snapshot.py
          --source-root third_party/orca-official
          --libnoise-source-root third_party/orca-deps-libnoise
          --manifest-output official-orca-source-manifest.json
      - name: Test source-target adapter for official libnoise lookup
        run: python3 -m unittest -v ci/test_official_orca_libnoise_adapter.py
      - name: Test official and legacy source-list inventory
        run: python3 -m unittest -v ci/test_official_orca_port_surface.py
      - name: Audit official-to-legacy Android port surface
        run: >-
          python3 ci/audit_official_orca_port_surface.py
          third_party/orca-official app/src/main/jni/libslic3r official-orca-port-surface
      - name: Source-build the pinned official libnoise closure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S third_party/orca-deps-libnoise -B official-orca-libnoise-build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build official-orca-libnoise-build --parallel 2
          find official-orca-libnoise-build -type f \
            \( -name 'liblibnoise_static.a' -o -name 'libnoise_static.a' \) -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: official-orca-port-surface
          path: |
            official-orca-port-surface
            official-orca-source-manifest.json
          if-no-files-found: error
