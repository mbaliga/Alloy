name: Path B G1 lean source build (no STEP)

on:
  push:
    branches: [stage1-path-b-g1-lean]
    paths:
      - '.github/workflows/path-b-g1-lean-no-step.yml'
      - 'ci/patch_slicebeam_stage1_no_step.py'
      - 'ci/patch_orca_mobile_bootstrap.py'
  pull_request:
    branches: [stage1-gates-prep]
    paths:
      - '.github/workflows/path-b-g1-lean-no-step.yml'
      - 'ci/patch_slicebeam_stage1_no_step.py'
      - 'ci/patch_orca_mobile_bootstrap.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alloy-path-b-g1-lean-${{ github.ref }}
  cancel-in-progress: true

env:
  SLICEBEAM_REPO: https://github.com/utkabobr/SliceBeam.git
  SLICEBEAM_SHA: 12b370ce305acc2caa59b7e4e78e04069db2f7e3
  BOOTSTRAP_REPO: https://github.com/CodeMasterCody3D/OrcaSlicer-Mobile.git
  BOOTSTRAP_SHA: d996a9cadb65b354997f2d5d8734b46bb9ea4efd
  ANDROID_API: '35'
  NDK_VERSION: 23.1.7779620

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK and build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make ninja-build pkg-config python3 git curl unzip

      - name: Clone exact SliceBeam engine
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive "$SLICEBEAM_REPO" slicebeam
          git -C slicebeam checkout --detach "$SLICEBEAM_SHA"
          git -C slicebeam submodule update --init --recursive
          test "$(git -C slicebeam rev-parse HEAD)" = "$SLICEBEAM_SHA"

      - name: Prepare reproducible Android dependency bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$BOOTSTRAP_REPO" bootstrap-source
          git -C bootstrap-source checkout --detach "$BOOTSTRAP_SHA"
          cp bootstrap-source/scripts/build_all_deps_android.sh slicebeam/build_all_deps_android.sh
          cp bootstrap-source/scripts/check-native-prebuilts.py slicebeam/check-native-prebuilts.py
          python3 ci/patch_orca_mobile_bootstrap.py \
            slicebeam/build_all_deps_android.sh \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_NDK_ROOT"
          python3 ci/patch_slicebeam_stage1_no_step.py slicebeam

          ! grep -R "Open-Cascade-SAS/OCCT\|Format/STEP.cpp\|OCCTWrapper" \
            slicebeam/build_all_deps_android.sh slicebeam/app/CMakeLists.txt

      - name: Build Stage 1 native dependencies from source
        working-directory: slicebeam
        shell: bash
        run: |
          set -euxo pipefail
          bash build_all_deps_android.sh
          python3 check-native-prebuilts.py arm64-v8a

      - name: Build lean native debug APK
        working-directory: slicebeam
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Record lean G1 evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p lean-g1-evidence
          {
            echo "SliceBeam: ${SLICEBEAM_SHA}"
            echo "Prusa baseline: fd02400245df25f1286059aa642739660df76663 (2.8.0)"
            echo "Stage 1 formats: STL, 3MF"
            echo "STEP/OCCT: excluded"
            echo "NDK: ${NDK_VERSION}"
            echo
            find slicebeam/app/build/outputs/apk -type f -name '*.apk' -print 2>/dev/null || true
          } > lean-g1-evidence/build.txt
          git -C slicebeam diff -- app/CMakeLists.txt app/src/main/jni/libslic3r/Model.cpp > lean-g1-evidence/no-step.patch || true

      - name: Upload lean G1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-g1-lean-no-step-evidence
          path: lean-g1-evidence
          if-no-files-found: error

      - name: Upload lean APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-g1-lean-debug-apk
          path: slicebeam/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
