name: Path B G1 SliceBeam source build

on:
  push:
    branches: [stage1-gates-prep]
    paths:
      - '.github/workflows/path-b-g1-slicebeam-source-build.yml'
      - 'ci/patch_orca_mobile_bootstrap.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alloy-path-b-g1-${{ github.ref }}
  cancel-in-progress: true

env:
  SLICEBEAM_REPO: https://github.com/utkabobr/SliceBeam.git
  SLICEBEAM_SHA: 12b370ce305acc2caa59b7e4e78e04069db2f7e3
  ORCA_MOBILE_REPO: https://github.com/CodeMasterCody3D/OrcaSlicer-Mobile.git
  ORCA_MOBILE_SHA: d996a9cadb65b354997f2d5d8734b46bb9ea4efd
  ANDROID_API: '35'
  NDK_VERSION: 23.1.7779620

jobs:
  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out Alloy gate scripts
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool make ninja-build pkg-config python3 git curl unzip

      - name: Clone pinned SliceBeam source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive "$SLICEBEAM_REPO" slicebeam
          git -C slicebeam checkout --detach "$SLICEBEAM_SHA"
          git -C slicebeam submodule update --init --recursive
          test "$(git -C slicebeam rev-parse HEAD)" = "$SLICEBEAM_SHA"

      - name: Borrow only the Android dependency bootstrap from pinned Orca-Mobile
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$ORCA_MOBILE_REPO" bootstrap-source
          git -C bootstrap-source checkout --detach "$ORCA_MOBILE_SHA"
          cp bootstrap-source/scripts/build_all_deps_android.sh slicebeam/build_all_deps_android.sh
          cp bootstrap-source/scripts/check-native-prebuilts.py slicebeam/check-native-prebuilts.py
          python3 ci/patch_orca_mobile_bootstrap.py \
            slicebeam/build_all_deps_android.sh \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_NDK_ROOT"

      - name: Build missing SliceBeam native dependencies from source
        working-directory: slicebeam
        shell: bash
        run: |
          set -euxo pipefail
          bash build_all_deps_android.sh
          python3 check-native-prebuilts.py arm64-v8a

      - name: Build SliceBeam native debug APK
        working-directory: slicebeam
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Record Path B G1 evidence
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p path-b-g1-evidence
          {
            echo "SliceBeam: ${SLICEBEAM_SHA}"
            echo "Dependency-bootstrap source: OrcaSlicer-Mobile ${ORCA_MOBILE_SHA}"
            echo "Android API: ${ANDROID_API}"
            echo "NDK: ${NDK_VERSION}"
            echo "Resolved SliceBeam: $(git -C slicebeam rev-parse HEAD 2>/dev/null || true)"
            find slicebeam/app/build/outputs/apk -type f -name '*.apk' -print 2>/dev/null || true
          } > path-b-g1-evidence/build.txt

      - name: Upload Path B G1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-g1-slicebeam-source-build
          path: path-b-g1-evidence
          if-no-files-found: error

      - name: Upload SliceBeam APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-slicebeam-debug-apk
          path: slicebeam/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
