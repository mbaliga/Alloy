          path: runtime/orca-artifact

      - name: Test semantic comparison metrics
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/test_compare_gcode.py

      - name: Compare semantic toolpaths, layers, time, and filament
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/parity
          failed=0
          for name in cube_20mm overhang_support thin_wall_frame; do
            if ! python3 parity/compare_gcode.py \
              "runtime/orca-artifact/orca-reference/$name/$name.gcode.3mf" \
              "runtime/prusa-artifact/prusa-reference/$name/$name.gcode" \
              --tolerance 0.02 \
              --json-out "runtime/parity/$name.json" \
              --summary-only; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload semantic parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-semantic-parity-reports
          path: runtime/parity
          if-no-files-found: warn
 runtime/path-b/a1mini-support.ini

      - name: Install AppImage host OpenGL runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglu1-mesa libsoup2.4-1 libwebkit2gtk-4.0-37

      - name: Download and extract PrusaSlicer 2.8.0
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/prusa
          curl -L --fail --retry 3 -o runtime/prusa/PrusaSlicer.AppImage "$PRUSA_APPIMAGE_URL"
          chmod +x runtime/prusa/PrusaSlicer.AppImage
          sha256sum runtime/prusa/PrusaSlicer.AppImage | tee runtime/prusa/SHA256SUMS
          (cd runtime/prusa && ./PrusaSlicer.AppImage --appimage-extract >/dev/null)
          test -x runtime/prusa/squashfs-root/AppRun

      - name: Capture Prusa CLI evidence
        shell: bash
        run: |
          set -euxo pipefail
          PRUSA="$GITHUB_WORKSPACE/runtime/prusa/squashfs-root/AppRun"
          mkdir -p runtime/evidence
          "$PRUSA" --help > runtime/evidence/prusa-help.txt 2>&1 || true
          "$PRUSA" --help-fff > runtime/evidence/prusa-help-fff.txt 2>&1 || true
          head -n 80 runtime/evidence/prusa-help.txt || true
          grep -E -- '--load|--export-gcode|--printer-technology' runtime/evidence/prusa-help.txt runtime/evidence/prusa-help-fff.txt | head -n 80 || true

      - name: Slice all fixtures through the exact Path B engine baseline
        shell: bash
        run: |
          set -euxo pipefail
          PRUSA="$GITHUB_WORKSPACE/runtime/prusa/squashfs-root/AppRun"
          CONFIG="$GITHUB_WORKSPACE/runtime/path-b/a1mini.ini"
          mkdir -p runtime/prusa-reference
          for stl in runtime/fixtures/*.stl; do
            name="$(basename "$stl" .stl)"
            out="$GITHUB_WORKSPACE/runtime/prusa-reference/$name"
            mkdir -p "$out"
            if ! "$PRUSA" --printer-technology FFF --center 90,90 --export-gcode --load "$CONFIG" --output "$out/$name.gcode" "$GITHUB_WORKSPACE/$stl" > "$out/prusa.log" 2>&1; then
              cat "$out/prusa.log"
              exit 1
            fi
            test -s "$out/$name.gcode"
          done

      - name: Reject unresolved template directives in executable G-code
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/check_rendered_gcode_templates.py runtime/prusa-reference/*/*.gcode

      - name: Record Path B runtime manifest
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "PrusaSlicer release: ${PRUSA_VERSION}"
            echo "SliceBeam baseline: ${SLICEBEAM_SHA}"
            echo "Orca profile snapshot translated: ${ORCA_PROFILE_SHA}"
            echo "Machine: Bambu Lab A1 mini 0.4 nozzle"
            echo "Process: 0.20mm Standard @BBL A1M"
            echo "Filament: Bambu PLA Basic @BBL A1M"
            echo
            sha256sum runtime/prusa-reference/*/*.gcode
          } > runtime/evidence/path-b-runtime-manifest.txt
          cat runtime/evidence/path-b-runtime-manifest.txt

      - name: Upload Path B runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-prusa-2.8-runtime-slices
          path: |
            runtime/path-b
            runtime/profiles
            runtime/prusa-reference
            runtime/prusa/SHA256SUMS
            runtime/evidence
          if-no-files-found: error

  orca-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic G3 geometry
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/generate_fixtures.py --out runtime/fixtures
          sha256sum runtime/fixtures/*.stl | tee runtime/fixtures/SHA256SUMS

      - name: Clone pinned Orca profile snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$ORCA_REPO" orca-profiles
          git -C orca-profiles checkout --detach "$ORCA_PROFILE_SHA"
          test "$(git -C orca-profiles rev-parse HEAD)" = "$ORCA_PROFILE_SHA"
          python3 parity/export_resolved_orca_profiles.py orca-profiles runtime/profiles

      - name: Install Orca AppImage runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglu1-mesa libwebkit2gtk-4.1-0

      - name: Download OrcaSlicer 2.4.2
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/orca
          curl -L --fail --retry 3 -o runtime/orca/OrcaSlicer.AppImage "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.4.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.4.2.AppImage"
          chmod +x runtime/orca/OrcaSlicer.AppImage
          (cd runtime/orca && ./OrcaSlicer.AppImage --appimage-extract >/dev/null)

      - name: Slice the same fixtures with pinned Orca profiles
        shell: bash
        run: |
          set -euxo pipefail
          ORCA="$GITHUB_WORKSPACE/runtime/orca/squashfs-root/AppRun"
          MACHINE="$GITHUB_WORKSPACE/runtime/profiles/machine.json"
          PROCESS="$GITHUB_WORKSPACE/runtime/profiles/process.json"
          FILAMENT="$GITHUB_WORKSPACE/runtime/profiles/filament.json"
          mkdir -p runtime/orca-reference
          for stl in runtime/fixtures/*.stl; do
            name="$(basename "$stl" .stl)"
            out="$GITHUB_WORKSPACE/runtime/orca-reference/$name"
            mkdir -p "$out"
            "$ORCA" --debug 2 --arrange 1 --slice 0 --load-settings "$MACHINE;$PROCESS" --load-filaments "$FILAMENT" --allow-newer-file --outputdir "$out" --export-3mf "$name.gcode.3mf" "$GITHUB_WORKSPACE/$stl" > "$out/orca.log" 2>&1
            python3 parity/verify_gcode_3mf.py "$out/$name.gcode.3mf"
          done

      - name: Upload pinned Orca comparison outputs
        uses: actions/upload-artifact@v4
        with:
          name: path-b-orca-comparison-inputs
          path: |
            runtime/orca-reference
            runtime/profiles
            runtime/fixtures/SHA256SUMS
          if-no-files-found: error

  semantic-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [translated-profile-runtime, orca-reference]
    steps:
      - uses: actions/checkout@v4

      - name: Download translated Prusa slices
        uses: actions/download-artifact@v4
        with:
          name: path-b-prusa-2.8-runtime-slices
          path: runtime/prusa-artifact

      - name: Download pinned Orca reference slices
        uses: actions/download-artifact@v4
        with:
          name: path-b-orca-comparison-inputs
          path: runtime/orca-artifact

      - name: Test semantic comparison metrics
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/test_compare_gcode.py

      - name: Compare semantic toolpaths, layers, time, and filament
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/parity
          failed=0
          for name in cube_20mm overhang_support thin_wall_frame; do
            if ! python3 parity/compare_gcode.py \
              "runtime/orca-artifact/orca-reference/$name/$name.gcode.3mf" \
              "runtime/prusa-artifact/prusa-reference/$name/$name.gcode" \
              --tolerance 0.02 \
              --json-out "runtime/parity/$name.json" \
              --summary-only; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload semantic parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-semantic-parity-reports
          path: runtime/parity
          if-no-files-found: warn
