name: Path B Prusa 2.8 runtime profile proof

on:
  push:
    branches: [stage1-path-b-prusa-runtime]
    paths:
      - '.github/workflows/path-b-prusa-runtime-slice.yml'
      - 'parity/build_path_b_prusa_config.py'
      - 'parity/export_resolved_orca_profiles.py'
      - 'parity/generate_fixtures.py'
      - 'parity/check_rendered_gcode_templates.py'
      - 'parity/compare_gcode.py'
      - 'parity/test_compare_gcode.py'
      - 'parity/verify_gcode_3mf.py'
  pull_request:
    branches: [stage1-runtime-parity]
    paths:
      - '.github/workflows/path-b-prusa-runtime-slice.yml'
      - 'parity/build_path_b_prusa_config.py'
      - 'parity/export_resolved_orca_profiles.py'
      - 'parity/generate_fixtures.py'
      - 'parity/check_rendered_gcode_templates.py'
      - 'parity/compare_gcode.py'
      - 'parity/test_compare_gcode.py'
      - 'parity/verify_gcode_3mf.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  ORCA_REPO: https://github.com/OrcaSlicer/OrcaSlicer.git
  ORCA_PROFILE_SHA: 07b81cfdc9e3933ee7cd8539d32bcf937f9d99b4
  SLICEBEAM_REPO: https://github.com/utkabobr/SliceBeam.git
  SLICEBEAM_SHA: 12b370ce305acc2caa59b7e4e78e04069db2f7e3
  PRUSA_VERSION: 2.8.0
  PRUSA_APPIMAGE_URL: https://github.com/prusa3d/PrusaSlicer/releases/download/version_2.8.0/PrusaSlicer-2.8.0+linux-x64-GTK3-202406270929.AppImage

jobs:
  translated-profile-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic fixtures
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/generate_fixtures.py --out runtime/fixtures
          sha256sum runtime/fixtures/*.stl | tee runtime/fixtures/SHA256SUMS

      - name: Clone pinned profile and engine sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$ORCA_REPO" orca-profiles
          git -C orca-profiles checkout --detach "$ORCA_PROFILE_SHA"
          test "$(git -C orca-profiles rev-parse HEAD)" = "$ORCA_PROFILE_SHA"
          git clone --filter=blob:none --no-checkout "$SLICEBEAM_REPO" slicebeam
          git -C slicebeam checkout --detach "$SLICEBEAM_SHA"
          test "$(git -C slicebeam rev-parse HEAD)" = "$SLICEBEAM_SHA"

      - name: Build deterministic Path B config
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/path-b
          python3 parity/export_resolved_orca_profiles.py orca-profiles runtime/profiles
          mkdir -p runtime/profiles-support
          cp runtime/profiles/machine.json runtime/profiles-support/machine.json
          cp runtime/profiles/filament.json runtime/profiles-support/filament.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          process = json.loads(Path("runtime/profiles/process.json").read_text())
          process["enable_support"] = "1"
          process["support_type"] = "tree(auto)"
          Path("runtime/profiles-support/process.json").write_text(json.dumps(process, indent=2) + chr(10))
          PY
          python3 parity/build_path_b_prusa_config.py runtime/profiles slicebeam runtime/path-b/a1mini.ini --report runtime/path-b/translation-report.json
          sha256sum runtime/path-b/a1mini.ini runtime/path-b/translation-report.json | tee runtime/path-b/SHA256SUMS
          head -n 80 runtime/path-b/a1mini.ini

      - name: Report unmapped source profile fields
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("runtime/path-b/translation-report.json").read_text())
          print(f"Unmapped source profile fields: {report['unsupported_count']}")
          for item in report["unsupported"]:
              print(f"{item['profile']}:{item['source']} -> {item['target']}")
          PY

      - name: Assert explicit tree-support translation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "parity")
          from build_path_b_prusa_config import normalize_value, rewrite_template
          config = Path("runtime/path-b/a1mini.ini").read_text()
          report = json.loads(Path("runtime/path-b/translation-report.json").read_text())
          assert report["derived_template_values"]["curr_bed_type"] == "Textured PEI Plate"
          plate_code = rewrite_template(';curr_bed_type={curr_bed_type}\n{if curr_bed_type=="Textured PEI Plate"}\nG29.1 Z{-0.02}\n{endif}', {"curr_bed_type": "Textured PEI Plate"})
          assert "G29.1 Z{-0.02}" in plate_code, repr(plate_code)
          assert "{if curr_bed_type" not in plate_code, repr(plate_code)
          assert "Alloy selected plate: Textured PEI Plate" in plate_code, repr(plate_code)
          assert "{Textured PEI Plate}" not in plate_code, repr(plate_code)
          assert "{curr_bed_type}" not in plate_code, repr(plate_code)
          flow = report["derived_template_values"]["outer_wall_volumetric_speed"]
          assert 15.08 < flow < 15.09, flow
          assert rewrite_template("F{outer_wall_volumetric_speed/(24/20)*60}", {"outer_wall_volumetric_speed": flow}) == f"F{{{flow:.9g}/(24/20)*60}}"
          assert "outer_wall_volumetric_speed" not in " ".join(report["gcode_template_keys"].values())
          assert normalize_value("support_material_style", "tree(auto)") == "organic"
          assert normalize_value("support_material_style", "tree(manual)") == "organic"
          assert normalize_value("fill_pattern", "crosshatch") == "grid"
          assert rewrite_template("G1 Y{first_layer_center_no_wipe_tower[1]}") == "G1 Y{(first_layer_print_min[1] + first_layer_print_max[1]) / 2}"
          assert rewrite_template("{filament_type[initial_no_support_extruder]}") == "{filament_type[0]}"
          assert rewrite_template("M620 S[initial_no_support_extruder]A") == "M620 S0A"
          assert rewrite_template("T255") == "T0"
          assert rewrite_template("M620.1 E F{flush_volumetric_speeds[initial_extruder]/2.4053*60} T{flush_temperatures[initial_extruder]}") == "M620.1 E F{max_volumetric_speed/2.4053*60} T{temperature[0]}"
          assert rewrite_template('{if !spiral_mode && print_sequence != "by object"}\nM971 S11\n{endif}') == '; Alloy omitted Bambu-only timelapse macro block (not portable to Prusa)\n'
          assert rewrite_template('M109 S{nozzle_temperature[initial_extruder]}') == 'M109 S{temperature[0]}'
          assert rewrite_template('M109 S{nozzle_temperature_initial_layer[initial_extruder]-20}') == 'M109 S{first_layer_temperature[0]-20}'
          assert all(
              entry.get("target_value") == "organic"
              for entry in report["mapped_values"]
              if entry.get("target") == "support_material_style"
          ), "tree support aliases must never be emitted untranslated"
          if "support_material = 1" in config:
              assert "support_material_style = organic" in config
          PY

      - name: Generate explicit support-enabled overhang profile
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/profiles-support
          cp runtime/profiles/machine.json runtime/profiles-support/machine.json
          cp runtime/profiles/filament.json runtime/profiles-support/filament.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          process = json.loads(Path("runtime/profiles/process.json").read_text())
          process["enable_support"] = "1"
          process["support_type"] = "tree(auto)"
          Path("runtime/profiles-support/process.json").write_text(json.dumps(process, indent=2) + chr(10))
          PY
          python3 parity/build_path_b_prusa_config.py runtime/profiles-support slicebeam runtime/path-b/a1mini-support.ini --report runtime/path-b/translation-support-report.json
          grep -q '^support_material = 1        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglu1-mesa libsoup2.4-1 libwebkit2gtk-4.0-37

      - name: Download and extract PrusaSlicer 2.8.0
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/prusa
          curl -L --fail --retry 3 -o runtime/prusa/PrusaSlicer.AppImage "$PRUSA_APPIMAGE_URL"
          chmod +x runtime/prusa/PrusaSlicer.AppImage
          sha256sum runtime/prusa/PrusaSlicer.AppImage | tee runtime/prusa/SHA256SUMS
          (cd runtime/prusa && ./PrusaSlicer.AppImage --appimage-extract >/dev/null)
          test -x runtime/prusa/squashfs-root/AppRun

      - name: Capture Prusa CLI evidence
        shell: bash
        run: |
          set -euxo pipefail
          PRUSA="$GITHUB_WORKSPACE/runtime/prusa/squashfs-root/AppRun"
          mkdir -p runtime/evidence
          "$PRUSA" --help > runtime/evidence/prusa-help.txt 2>&1 || true
          "$PRUSA" --help-fff > runtime/evidence/prusa-help-fff.txt 2>&1 || true
          head -n 80 runtime/evidence/prusa-help.txt || true
          grep -E -- '--load|--export-gcode|--printer-technology' runtime/evidence/prusa-help.txt runtime/evidence/prusa-help-fff.txt | head -n 80 || true

      - name: Slice all fixtures through the exact Path B engine baseline
        shell: bash
        run: |
          set -euxo pipefail
          PRUSA="$GITHUB_WORKSPACE/runtime/prusa/squashfs-root/AppRun"
          CONFIG="$GITHUB_WORKSPACE/runtime/path-b/a1mini.ini"
          mkdir -p runtime/prusa-reference
          for stl in runtime/fixtures/*.stl; do
            name="$(basename "$stl" .stl)"
            if [[ "$name" == "overhang_support" ]]; then
              CONFIG="$GITHUB_WORKSPACE/runtime/path-b/a1mini-support.ini"
            else
              CONFIG="$GITHUB_WORKSPACE/runtime/path-b/a1mini.ini"
            fi
            out="$GITHUB_WORKSPACE/runtime/prusa-reference/$name"
            mkdir -p "$out"
            if ! "$PRUSA" --printer-technology FFF --center 90,90 --export-gcode --load "$CONFIG" --output "$out/$name.gcode" "$GITHUB_WORKSPACE/$stl" > "$out/prusa.log" 2>&1; then
              cat "$out/prusa.log"
              exit 1
            fi
            test -s "$out/$name.gcode"
          done

      - name: Assert support toolpaths exist in both overhang slices
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "parity")
          from compare_gcode import parse_metrics
          paths = [
              Path("runtime/prusa-reference/overhang_support/overhang_support.gcode"),
              Path("runtime/orca-reference/overhang_support/overhang_support.gcode.3mf"),
          ]
          for path in paths:
              features = parse_metrics(path, None).feature_counts
              assert "support" in features or "support_interface" in features, (str(path), features)
              print(f"Verified support toolpath in {path}")
          PY

      - name: Reject unresolved template directives in executable G-code
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/check_rendered_gcode_templates.py runtime/prusa-reference/*/*.gcode

      - name: Record Path B runtime manifest
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "PrusaSlicer release: ${PRUSA_VERSION}"
            echo "SliceBeam baseline: ${SLICEBEAM_SHA}"
            echo "Orca profile snapshot translated: ${ORCA_PROFILE_SHA}"
            echo "Machine: Bambu Lab A1 mini 0.4 nozzle"
            echo "Process: 0.20mm Standard @BBL A1M"
            echo "Filament: Bambu PLA Basic @BBL A1M"
            echo
            sha256sum runtime/prusa-reference/*/*.gcode
          } > runtime/evidence/path-b-runtime-manifest.txt
          cat runtime/evidence/path-b-runtime-manifest.txt

      - name: Upload Path B runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-prusa-2.8-runtime-slices
          path: |
            runtime/path-b
            runtime/profiles
            runtime/profiles-support
            runtime/prusa-reference
            runtime/prusa/SHA256SUMS
            runtime/evidence
          if-no-files-found: error

  orca-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic G3 geometry
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/generate_fixtures.py --out runtime/fixtures
          sha256sum runtime/fixtures/*.stl | tee runtime/fixtures/SHA256SUMS

      - name: Clone pinned Orca profile snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout "$ORCA_REPO" orca-profiles
          git -C orca-profiles checkout --detach "$ORCA_PROFILE_SHA"
          test "$(git -C orca-profiles rev-parse HEAD)" = "$ORCA_PROFILE_SHA"
          python3 parity/export_resolved_orca_profiles.py orca-profiles runtime/profiles
          mkdir -p runtime/profiles-support
          cp runtime/profiles/machine.json runtime/profiles-support/machine.json
          cp runtime/profiles/filament.json runtime/profiles-support/filament.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          process = json.loads(Path("runtime/profiles/process.json").read_text())
          process["enable_support"] = "1"
          process["support_type"] = "tree(auto)"
          Path("runtime/profiles-support/process.json").write_text(json.dumps(process, indent=2) + chr(10))
          PY

      - name: Install Orca AppImage runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglu1-mesa libwebkit2gtk-4.1-0

      - name: Download OrcaSlicer 2.4.2
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/orca
          curl -L --fail --retry 3 -o runtime/orca/OrcaSlicer.AppImage "https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.4.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.4.2.AppImage"
          chmod +x runtime/orca/OrcaSlicer.AppImage
          (cd runtime/orca && ./OrcaSlicer.AppImage --appimage-extract >/dev/null)

      - name: Slice the same fixtures with pinned Orca profiles
        shell: bash
        run: |
          set -euxo pipefail
          ORCA="$GITHUB_WORKSPACE/runtime/orca/squashfs-root/AppRun"
          MACHINE="$GITHUB_WORKSPACE/runtime/profiles/machine.json"
          PROCESS="$GITHUB_WORKSPACE/runtime/profiles/process.json"
          SUPPORT_PROCESS="$GITHUB_WORKSPACE/runtime/profiles-support/process.json"
          FILAMENT="$GITHUB_WORKSPACE/runtime/profiles/filament.json"
          mkdir -p runtime/orca-reference
          for stl in runtime/fixtures/*.stl; do
            name="$(basename "$stl" .stl)"
            if [[ "$name" == "overhang_support" ]]; then
              ACTIVE_PROCESS="$SUPPORT_PROCESS"
            else
              ACTIVE_PROCESS="$PROCESS"
            fi
            out="$GITHUB_WORKSPACE/runtime/orca-reference/$name"
            mkdir -p "$out"
            "$ORCA" --debug 2 --arrange 1 --slice 0 --load-settings "$MACHINE;$ACTIVE_PROCESS" --load-filaments "$FILAMENT" --allow-newer-file --outputdir "$out" --export-3mf "$name.gcode.3mf" "$GITHUB_WORKSPACE/$stl" > "$out/orca.log" 2>&1
            python3 parity/verify_gcode_3mf.py "$out/$name.gcode.3mf"
          done

      - name: Upload pinned Orca comparison outputs
        uses: actions/upload-artifact@v4
        with:
          name: path-b-orca-comparison-inputs
          path: |
            runtime/orca-reference
            runtime/profiles
            runtime/profiles-support
            runtime/fixtures/SHA256SUMS
          if-no-files-found: error

  semantic-parity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [translated-profile-runtime, orca-reference]
    steps:
      - uses: actions/checkout@v4

      - name: Download translated Prusa slices
        uses: actions/download-artifact@v4
        with:
          name: path-b-prusa-2.8-runtime-slices
          path: runtime/prusa-artifact

      - name: Download pinned Orca reference slices
        uses: actions/download-artifact@v4
        with:
          name: path-b-orca-comparison-inputs
          path: runtime/orca-artifact

      - name: Test semantic comparison metrics
        shell: bash
        run: |
          set -euxo pipefail
          python3 parity/test_compare_gcode.py

      - name: Compare semantic toolpaths, layers, time, and filament
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p runtime/parity
          failed=0
          for name in cube_20mm overhang_support thin_wall_frame; do
            if ! python3 parity/compare_gcode.py \
              "runtime/orca-artifact/orca-reference/$name/$name.gcode.3mf" \
              "runtime/prusa-artifact/prusa-reference/$name/$name.gcode" \
              --tolerance 0.02 \
              --json-out "runtime/parity/$name.json" \
              --summary-only; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload semantic parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-b-semantic-parity-reports
          path: runtime/parity
          if-no-files-found: warn
 runtime/path-b/a1mini-support.ini
          grep -q '^support_material_style = organic        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglu1-mesa libsoup2.4-1 libwebkit2gtk-4.0-37

      - name: Download and extract PrusaSlicer 2.8.0
        shell: bash
        run: |
