<title>Alloy Forge — parametric tools</title>
<style>
:root{--ink:#e8f0f4;--dim:#8fa3ae;--faint:#5d717c;--acc:#8ff0c4;--warn:#ffb86b;--bad:#ff7b7b;--glass:rgba(13,18,21,.66);--glass2:rgba(255,255,255,.05);
--mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.light{--ink:#162026;--dim:#5a6b74;--faint:#8b9aa2;--acc:#11916a;--glass:rgba(250,252,253,.74);--glass2:rgba(0,0,0,.05);background:#eef1f3}
body.light input,body.light select{background:rgba(0,0,0,.05)}
body.light #send{color:#fff}body.light .btn{color:#fff}
body.light dialog{background:rgba(250,252,253,.97)}
body.light #stats,body.light .tb{text-shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0e1215;color:var(--ink);font:13px/1.4 var(--sans)}
#vp{position:fixed;inset:0;background:#0e1215}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(0,0,0,.38) 100%)}
body.light #vig{background:radial-gradient(ellipse at 50% 46%,transparent 60%,rgba(120,135,145,.22) 100%)}
.brand em{font-style:normal;color:var(--dim);font-weight:500}
#vp canvas{display:block;touch-action:none}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.3;cursor:default}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);border-radius:20px}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em;font-size:10.5px}

header{position:fixed;top:12px;left:16px;right:16px;display:flex;align-items:center;gap:14px;z-index:5;pointer-events:none}
header>*{pointer-events:auto}
.brand{white-space:nowrap;font-family:var(--mono);letter-spacing:.22em;font-size:11px;font-weight:600;color:var(--acc)}
.slash{color:var(--faint);font-family:var(--mono)}
#pname{background:none;border:0;outline:0;width:min(30vw,220px);color:var(--ink);font-size:13px;padding:4px 0;border-bottom:1px solid transparent}
#pname:focus{border-bottom-color:var(--faint)}
.sp{flex:1;pointer-events:none}
.hb{font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;color:var(--dim);padding:8px 6px}
.hb:hover:not(:disabled),.hb.on{color:var(--acc)}
.menu{position:relative}
#expm{position:absolute;right:0;top:100%;min-width:190px;padding:8px;z-index:20;display:flex;flex-direction:column}
#expm[hidden]{display:none}
#expm button{text-align:left;padding:8px 10px;border-radius:10px;color:var(--ink)}
#expm button:hover{background:var(--glass2);color:var(--acc)}
#kernel,#tmpl{flex:none;appearance:none;background:none;border:0;font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;color:var(--dim);cursor:pointer;padding:8px 6px}
#kernel{width:92px}#tmpl{width:88px}#kernel option,#tmpl option{color:#111;text-transform:none}
#kstate{flex:none;font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.06em;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.kbusy #kstate{color:var(--acc)}
.crow{flex-wrap:wrap;gap:2px 8px}.crow .nm{flex:1}.crow .tag{flex-basis:100%;margin-left:24px;text-transform:none;letter-spacing:.02em;white-space:normal}
.okv{color:#8ff0c4}
#addf{flex:none;appearance:none;background:none;border:0;font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;color:var(--dim);cursor:pointer;padding:8px 6px;width:74px}
#addf option{color:#111;text-transform:none}


/* Loop pane */
#p-loop{display:flex;flex-direction:column;gap:8px}
#p-loop[hidden]{display:none}
#p-loop textarea{width:100%;resize:vertical;background:rgba(255,255,255,.06);border:1px solid transparent;border-radius:9px;padding:6px 8px;color:var(--ink);font:inherit;outline:0}
#p-loop textarea:focus{border-color:rgba(143,240,196,.5)}
#p-loop .lhead,#p-loop .lrow{display:flex;align-items:center;gap:2px;flex-wrap:wrap}#p-loop .lhead .tip,#p-loop .lrow .tip{flex-basis:100%}
.lgraph{width:100%;height:auto;color:var(--faint);background:var(--glass2);border-radius:12px}
.lgraph .ln rect{fill:rgba(255,255,255,.05);stroke:var(--faint);stroke-width:1}
.lgraph .ln text{fill:var(--dim);font:8px var(--mono);text-transform:uppercase;letter-spacing:.05em}
.lgraph .ln.pass rect{stroke-dasharray:3 3}.lgraph .ln.human rect{stroke:var(--warn)}
.lgraph .ln.active rect{stroke:var(--acc);fill:rgba(143,240,196,.16);stroke-width:1.6}.lgraph .ln.active text{fill:var(--acc)}
.lgraph .ll{fill:var(--faint);font:7px var(--mono);text-transform:uppercase}
.lgraph .le.back{stroke-dasharray:4 3}
.lgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.lgrid.two{grid-template-columns:1fr 1fr}
.lf{display:flex;flex-direction:column;gap:2px}.lf span{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;font-size:9.5px;color:var(--faint)}
.lf input{width:100%}
.lbtns{display:flex;gap:8px;align-items:center}
.btn:disabled{opacity:.4;cursor:default}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-family:var(--mono);font-size:10.5px}
.meters div{display:flex;flex-direction:column;background:var(--glass2);border-radius:9px;padding:5px 7px}.meters span{color:var(--faint);text-transform:uppercase;font-size:9px;letter-spacing:.08em}
.lstate{font-size:12px}.lstate.good,.good{color:var(--acc)}.bad{color:var(--bad)}.faint{color:var(--faint);font-size:11px}
.approval{background:rgba(255,184,107,.1);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.round{background:var(--glass2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:11.5px}
.round.ok{box-shadow:inset 2px 0 0 var(--acc)}
.round .rh{display:flex;gap:10px;align-items:baseline}.round .ex{color:var(--dim)}
.round .ck{display:flex;gap:6px;font-size:11px}
.ops{margin:0;white-space:pre-wrap;font:10.5px var(--mono);color:var(--dim)}
.vrow{display:flex;gap:10px;align-items:center;font-size:11.5px;padding:6px 8px;background:var(--glass2);border-radius:10px}.vrow.col{flex-direction:column;align-items:stretch;gap:4px}
.vh{display:flex;gap:10px;align-items:center}.vh .btn{margin-left:auto;padding:5px 14px}
.afterline{font-size:12px;color:var(--dim)}.lnk{color:var(--acc);text-decoration:underline;font:inherit}

.sec{position:fixed;z-index:4;padding:14px 14px 10px;overflow:auto;display:none}
.sec h3{margin:0 0 8px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:500;color:var(--faint)}
@media(min-width:900px){
 .sec{display:block}
 #left{left:16px;top:56px;width:292px;max-height:calc(100vh - 250px)}
 #inspsec{right:16px;top:56px;width:324px;max-height:calc(100vh - 250px)}
 #tabs{display:none!important}
}
.ptabs{display:flex;gap:11px;margin:0 0 10px 2px}
.ptabs button{font-family:var(--mono);text-transform:uppercase;letter-spacing:.09em;font-size:10px;color:var(--faint);padding:2px 0}
.ptabs button.on{color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50% 50% 50% 18%;display:inline-block;flex:none}
.g{color:var(--faint);font-size:11px;width:20px;font-family:var(--mono)}.g:hover{color:var(--ink)}.g.on{color:var(--acc)}.g.lk{color:var(--warn)}
.row.dimmed{opacity:.4}.row.locked .nm{color:var(--dim)}
.prow.locked .pe{opacity:.55}
.tip{grid-column:1/-1;color:var(--dim);font-size:11.5px;padding:6px 10px;border-radius:10px;background:var(--glass2);margin:2px 0 4px}
.tip[hidden]{display:none}
.hint{color:var(--faint);font-size:11px;margin-top:10px}
.lockline{color:var(--warn);font-size:11.5px;margin:-2px 0 8px}
input.nl{animation:pulse .7s infinite alternate;border-color:rgba(143,240,196,.6)}
.facts{display:grid;gap:4px;margin:10px 0;font-family:var(--mono);font-size:11px}
.facts div{display:flex;justify-content:space-between;gap:10px}.facts span{color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink);background:var(--glass2);padding:6px 10px;border-radius:999px}
.chip:hover:not(:disabled){color:var(--acc)}
.stat.cur b{color:var(--acc)}
input[type=color]{padding:2px;height:30px;width:100%}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:12px;cursor:pointer}
.row:hover{background:var(--glass2)}
.row.sel{background:rgba(143,240,196,.12)}
.row.off .nm,.row.off .ico{opacity:.35;text-decoration:line-through}
.ico{width:16px;text-align:center;color:var(--dim)}
.nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-family:var(--mono);font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.tag.cut{color:var(--warn)}.tag.ref{color:#6ff0d0}
.err{color:var(--bad);font-weight:700;width:14px;text-align:center}
.eye{color:var(--faint);font-size:10px;width:22px}.eye:hover{color:var(--acc)}
.empty{color:var(--faint);padding:10px 8px}
.prow{display:flex;align-items:center;gap:8px;padding:3px 4px}
.pn{width:74px;font-family:var(--mono);font-size:11.5px;color:var(--acc);overflow:hidden;text-overflow:ellipsis}
.pn-in{width:74px}
input,select{background:rgba(255,255,255,.06);border:1px solid transparent;border-radius:9px;padding:6px 8px;min-width:0;outline:0}
input:focus,select:focus{border-color:rgba(143,240,196,.5)}
select{appearance:none;-webkit-appearance:none;cursor:pointer}
select option{color:#111}
.pe{flex:1}
.pv{font-family:var(--mono);font-size:10.5px;color:var(--dim);min-width:56px}
.x{color:var(--faint);width:22px;font-size:15px}.x:hover{color:var(--bad)}.x.ok:hover{color:var(--acc)}
.ihead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ihead b{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600}
.acts{margin-left:auto;display:flex;gap:2px}.acts button{width:28px;height:26px;color:var(--dim);border-radius:8px}.acts button:hover{background:var(--glass2);color:var(--acc)}
.i{width:15px;height:15px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font:italic 10px/13px serif;text-align:center;margin-left:6px;vertical-align:middle}
.i:hover{color:var(--acc);border-color:var(--acc)}
.tipbox{color:var(--dim);margin:0 0 8px;padding:8px 10px;border-radius:12px;background:var(--glass2)}
.fld{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:4px 8px;padding:3px 0}
.fld .lb{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.fld .rv{grid-column:2;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:-2px}
.vec{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.errbox{margin-top:10px;padding:8px 10px;border-radius:12px;background:rgba(255,123,123,.12);color:var(--bad)}

#stats{position:fixed;right:16px;bottom:96px;z-index:3;display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--dim);pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.stat{display:flex;gap:10px;align-items:center}.stat i{width:8px;height:8px;border-radius:50%;display:inline-block}.stat b{color:var(--ink);font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warn{color:var(--warn)}

#tools{position:fixed;left:16px;bottom:96px;z-index:4;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tr{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.tb{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--dim);padding:7px 8px;border-radius:10px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.sl{color:var(--faint);font-family:var(--mono);font-size:11px;padding:0 4px}.tb:hover{color:var(--ink)}.tb.on{color:var(--acc)}
#sec-axis{width:auto;background:none;font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--dim);padding:7px 8px}
#sec-pos{width:110px;accent-color:#8ff0c4;padding:0}
#pickbar{position:fixed;left:50%;transform:translateX(-50%);top:54px;z-index:5;display:flex;gap:12px;align-items:center;padding:8px 14px;border-radius:999px;font-family:var(--mono);font-size:11px}
#pickbar[hidden]{display:none}
#pickbar button{color:var(--acc)}.dim{color:var(--dim)}

#selbar{display:flex;align-items:center;gap:2px;padding:4px 6px 4px 14px;border-radius:999px;align-self:center;max-width:100%;overflow-x:auto;scrollbar-width:none}
#selbar[hidden]{display:none}#selbar::-webkit-scrollbar{display:none}
#selbar .slabel{flex-shrink:0;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap;margin-right:8px;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.sb{flex-shrink:0;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--dim);padding:9px 7px;border-radius:999px;white-space:nowrap;min-height:34px}
.sb:hover:not(:disabled){color:var(--ink);background:var(--glass2)}.sb.on{color:var(--acc)}.sb.danger:hover:not(:disabled){color:var(--bad)}.sb:disabled{opacity:.35}
.sb.x{color:var(--faint);padding:9px 10px}
#ctxmenu{position:fixed;z-index:20;min-width:190px;padding:6px;border-radius:16px;display:flex;flex-direction:column}
#ctxmenu[hidden]{display:none}
#ctxmenu button{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:9px 12px;border-radius:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--ink);min-height:38px}
#ctxmenu button:hover:not(:disabled){background:var(--glass2);color:var(--acc)}#ctxmenu button.danger:hover:not(:disabled){color:var(--bad)}#ctxmenu button:disabled{opacity:.35}
#ctxmenu kbd{font-family:var(--mono);font-size:10px;color:var(--faint)}
@media(max-width:1399px){#selbar .slabel{display:none}#selbar{padding-left:8px}}
@media(max-width:899px){#ctxmenu button kbd{display:none}}
#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(680px,calc(100vw - 24px));z-index:6;display:flex;flex-direction:column;gap:8px}
#reply{padding:10px 14px;border-radius:18px;max-height:34vh;overflow:auto}
#reply[hidden]{display:none}
#reply .log{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
#reply code{font-family:var(--mono);font-size:10.5px;color:var(--dim);background:var(--glass2);padding:2px 7px;border-radius:999px}
.lnk{color:var(--acc);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-left:auto;padding:4px}
#promptbar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 18px;border-radius:999px}
#ask{flex:1;background:none;border:0;padding:8px 0;font-size:14px}
#ask::placeholder{color:var(--faint)}
#send{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#0b1a14;font-weight:700;font-size:16px}
body.thinking #send{animation:pulse .9s infinite alternate}
@keyframes pulse{to{opacity:.35}}
#spark{color:var(--acc);font-size:13px}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,14,16,.7))}
#tabs button{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--dim);padding:8px 14px}
#tabs button.on{color:var(--acc)}
@media(max-width:899px){
 header{gap:8px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}header::-webkit-scrollbar{display:none}header>*{flex-shrink:0}.brand{letter-spacing:.14em}.brand em{display:none}#pname{width:34vw}
 .sec.show{display:block;left:10px;right:10px;bottom:132px;max-height:46vh;z-index:8}
 #bottom{bottom:44px}
 #tools{bottom:auto;top:46px;left:10px;right:10px;flex-direction:row;overflow-x:auto;gap:2px;padding-bottom:2px}
 .tr{flex-wrap:nowrap}
 #stats{right:10px;bottom:auto;top:92px;align-items:flex-end}
 .hb.opt{display:none}
 #pickbar{top:88px}
}
/* extensions (docs/STYLE.md: glass, mono labels, state = word + shape, phone sheets) */
.tier{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--glass2);color:var(--dim)}
.tier.extension{color:var(--warn)}.tier.plugin{color:var(--acc)}
.xpkg{padding:10px 12px;margin:8px 0;border-radius:16px;background:var(--glass2)}.xpkg.missing{opacity:.75}

.errbox.warn{background:rgba(255,200,90,.12);color:var(--ink)}.crow input{width:84px}.matgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}.matf{display:grid;gap:2px}.matf .lb{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--faint)}

.chip.on{color:var(--acc)}.xlog pre{font-size:10px;white-space:pre-wrap;color:var(--dim);margin:4px 0 0}.xlog summary{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);cursor:pointer;margin-top:6px}
.extframe{width:100%;height:220px;border:0;border-radius:14px;background:var(--glass2);display:block}.extpane{margin:8px 0}.extslot{margin-top:4px}
#legend{position:fixed;left:12px;bottom:76px;z-index:6;width:min(280px,calc(100vw - 24px));padding:10px 12px;border-radius:18px;display:flex;flex-direction:column;gap:10px}
#legend[hidden],#probe[hidden]{display:none}.lg.off{opacity:.55}.lgh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lgh .g{margin-left:0}.lgh b{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.lgslice{display:flex;align-items:center;gap:8px;margin-top:6px}.lgslice input[type=range]{flex:1;accent-color:#8ff0c4;padding:0}.lgslice select{width:auto;padding:6px 8px}
.lgbar{height:10px;border-radius:6px;margin:6px 0 2px}.lgt{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim)}
#probe{position:fixed;left:50%;transform:translateX(-50%);top:92px;z-index:9;padding:8px 14px;border-radius:999px;font-family:var(--mono);font-size:11px;white-space:nowrap;max-width:calc(100vw - 20px);overflow:hidden;text-overflow:ellipsis}
#layersdlg{position:fixed;margin:0;inset:auto 16px 76px auto;width:min(340px,calc(100vw - 20px));max-height:70vh;padding:16px 16px 14px;z-index:8;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass2);color:var(--ink)}
#layersdlg:not([open]){display:none}
.lyhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}.lyhead .chip{min-height:32px}
.lygrp{margin:10px 0 4px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.ly{padding:8px 0;border-top:1px solid var(--glass2)}.ly.off{opacity:.6}
.lyrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lyrow b{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;flex:1;min-width:0;overflow-wrap:anywhere}
.lysw{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;cursor:pointer;min-height:32px}.lysw input{width:34px;height:20px;accent-color:#8ff0c4}
.lyop{display:flex;align-items:center;gap:8px;margin-top:4px}.lyop input[type=range]{flex:1;accent-color:#8ff0c4;padding:0;min-height:28px}.lyop .tag{min-width:38px;text-align:right}
.lysw1{width:34px;height:8px;border-radius:4px;flex:none}.lyread{margin-top:2px;text-transform:none;letter-spacing:.02em;white-space:normal}
.lyempty{color:var(--dim);font-size:12px;padding:6px 0}
@media(max-width:899px){#layersdlg{inset:auto 0 0 0;width:100%;max-height:56vh;border-radius:24px 24px 0 0;border-bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}#layersdlg .chip,#layersdlg .lysw,#layersdlg .g{min-height:40px}#layersdlg .lyop input[type=range]{min-height:40px}#layersdlg .g{min-width:40px}}
@media(min-width:900px){#legend{left:auto;right:16px}}
@media(max-width:899px){dialog.sheet{margin:auto 0 0;width:100%;max-width:none;border-radius:24px 24px 0 0;max-height:88vh}#legend{bottom:132px;left:10px}#probe{top:128px}.extframe{height:260px}.xpkg .chip,#extdlg .chip,#p-analyze .chip,#p-analyze button.g,#p-analyze select,#p-analyze input,#p-analyze summary{min-height:40px}#p-analyze button.g{min-width:40px}}
dialog.sheet::backdrop{background:rgba(5,8,10,.55)}
dialog{background:rgba(16,22,26,.96);color:var(--ink);border:0;border-radius:24px;padding:22px 22px 18px;width:min(560px,calc(100vw - 20px));max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(5,8,10,.55);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 14px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:600;color:var(--acc)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.wgrid label,.sg label{display:flex;flex-direction:column;gap:3px}
.wgrid span,.sg span.l{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.sub{margin:16px 0 6px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);display:flex;align-items:center}
.port{display:grid;grid-template-columns:1.4fr .7fr repeat(4,.6fr) 24px;gap:5px;margin-bottom:5px}
.port input,.port select{padding:6px 5px;font-size:12px}
.sg{display:grid;gap:12px}
.sg .chk{flex-direction:row;align-items:center;gap:8px}
.dact{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn{background:var(--acc);color:#0b1a14;border-radius:999px;padding:9px 20px;font-weight:600}
.btn.ghost{background:none;color:var(--dim)}
.note{color:var(--faint);font-size:11.5px}
.fatal{position:fixed;inset:20px;color:var(--bad);white-space:pre-wrap;z-index:99}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
#pins{position:fixed;inset:0;z-index:5;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;background:transparent;border:0;padding:0;cursor:pointer;color:var(--ink)}
.pin .pg{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;line-height:1;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid currentColor}
.pin.high{color:var(--bad)}.pin.medium{color:var(--warn)}.pin.low{color:var(--acc)}.pin.info{color:var(--faint)}.pin:focus-visible .pg{outline:2px solid var(--acc);outline-offset:2px}
#pincard{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:9;width:min(340px,calc(100vw - 20px));max-height:34vh;overflow:auto;padding:10px 12px;border-radius:18px}#pincard[hidden]{display:none}
.pcnav{display:flex;align-items:center;gap:8px}.pcnav b{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;flex:1}
.rdetail{padding:6px 4px 8px 24px;font-size:12.5px}#pincard .rdetail{padding-left:2px}.rwhy{margin-bottom:4px}.rfix{margin:6px 0;color:var(--dim)}.rfix b{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.rflag.high .ico{color:var(--bad)}.rflag.medium .ico{color:var(--warn)}.rflag.low .ico{color:var(--acc)}
.arisk{margin:10px 0}.rspark svg{display:block}.jedit{padding:4px 6px 8px 14px;border-left:1px solid var(--glass2);margin:2px 0 8px}.jedit .fld,#duty-sec .fld{grid-template-columns:96px minmax(0,1fr)}.fld .xrow{min-width:0}.fld .xrow input,.fld .xrow select{flex:0 1 auto;min-width:0}.fld .xrow input[aria-label="Joint name"]{flex:1 1 100px}.fld .xrow input[type=checkbox]{flex:none}
@media(max-width:899px){#pincard{bottom:132px}#pincard .g,#pincard .chip,#p-analyze .rflag,#p-analyze .row{min-height:40px}#pincard .g{min-width:40px}}
</style>
</head>
<body>
<div id="vp"></div>
<div id="pins" aria-label="Risk pins"></div>

<header>
  <span class="brand">ALLOY <em>FORGE</em></span><span class="slash">/</span>
  <input id="pname" spellcheck="false" aria-label="Project name">
  <span class="sp"></span>
  <button class="hb" id="undo" title="Undo">↶</button><button class="hb" id="redo" title="Redo">↷</button>
  <button class="hb opt" id="new">New</button>
  <select id="tmpl" title="New from template"><option value="">▤ Template</option><option value="pcb-enclosure">PCB enclosure</option></select>
  <select id="kernel" title="Geometry kernel: Manifold (fast mesh) or OCCT (true B-rep)"><option value="manifold">Manifold</option><option value="occt">OCCT B-rep</option></select><span id="kstate" aria-live="polite"></span>
  <select id="addf" title="Add feature"><option value="">＋ Add</option></select>
  <button class="hb opt" id="imp">Import</button>
  <button class="hb opt" id="impasm" title="Import a STEP assembly and tag its solids as PCB parts">PCB STEP</button>
  <span class="menu"><button class="hb" id="exp">Export</button><div id="expm" class="glass" hidden></div></span>
  <button class="hb" id="theme" title="Light / dark">◐</button><button class="hb" id="gear" title="Settings and API key">⚙</button>
  <input type="file" id="file" accept=".stp,.step,.stl,.json" hidden>
</header>

<div id="vig"></div>
<section class="sec glass" id="left">
  <div class="ptabs"><button data-pane="objects">Objects</button><button data-pane="tree">Features</button><button data-pane="params">Params</button><button data-pane="check">Check</button><button data-pane="loop">Loop</button><button data-pane="ext" id="t-ext" hidden>Ext</button><button data-pane="analyze" id="t-an" hidden>Analyze</button></div>
  <div class="pane" id="p-objects"></div><div class="pane" id="p-tree"></div><div class="pane" id="p-params"></div><div class="pane" id="p-check"></div><div class="pane" id="p-loop"></div><div class="pane" id="p-ext"></div><div class="pane" id="p-analyze"></div>
</section>
<section class="sec glass" id="inspsec"><h3>Inspector</h3><div id="insp"></div></section>

<div id="pickbar" class="glass" hidden></div>
<div id="ctxmenu" class="glass" hidden></div>

<div id="tools">
  <div class="tr"><button class="tb on" data-mode="orbit">Select</button><button class="tb" data-mode="pick">Pick</button><button class="tb" data-mode="measure">Measure</button><span class="sl">/</span><button class="tb" data-gz="translate" title="Move gizmo (G)">Move</button><button class="tb" data-gz="rotate" title="Rotate gizmo (R)">Rotate</button><button class="tb" data-gz="snap" title="Snap 0.5 mm / 15°">Snap</button></div>
  <div class="tr">
    <button class="tb" data-view="iso">Iso</button><button class="tb" data-view="top">Top</button><button class="tb" data-view="front">Front</button><button class="tb" data-view="right">Right</button><button class="tb" id="fit">Fit</button>
    <button class="tb" id="ortho">Ortho</button><button class="tb on" id="edges">Edges</button><button class="tb" id="layers-btn" type="button" aria-haspopup="dialog" title="Overlay layers">Layers</button>
  </div>
  <div class="tr"><select id="sec-axis" title="Section view"><option value="off">Section off</option><option value="x">Section X</option><option value="y">Section Y</option><option value="z">Section Z</option></select><input type="range" id="sec-pos" hidden step="0.1"></div>
</div>
<div id="stats"></div>

<div id="bottom">
  <div id="selbar" class="glass" hidden></div>
  <div id="reply" class="glass" hidden></div>
  <div id="promptbar" class="glass"><span id="spark">✦</span><input id="ask" placeholder="Ask for a change…" autocomplete="off" enterkeyhint="send"><button id="send" title="Send">↑</button></div>
</div>
<nav id="tabs"><button data-sec="objects">Objects</button><button data-sec="tree">Features</button><button data-sec="params">Params</button><button data-sec="check">Check</button><button data-sec="loop">Loop</button><button data-sec="ext" id="n-ext" hidden>Ext</button><button data-sec="analyze" id="n-an" hidden>Analyze</button><button data-sec="insp">Inspect</button><button onclick="document.getElementById('new').click()">New</button></nav>

<dialog id="wizard"><h2>New enclosure</h2><div id="wbody"></div><div class="dact"><button class="btn ghost" id="wclose">Cancel</button><button class="btn" id="wgo">Generate</button></div></dialog>

<dialog id="settings"><h2>Settings</h2>
  <div class="sg">
    <label><span class="l">AI provider</span><select id="s-provider"><option value="claude">Claude (built in, hosted page only — no key)</option><option value="anthropic">Anthropic</option><option value="openai">OpenAI-compatible (OpenRouter, Ollama, …)</option></select></label>
    <label><span class="l">Base URL <button class="i" title="Leave blank for the provider default. For a local model use e.g. http://localhost:11434/v1" type="button">i</button></span><input id="s-base" placeholder="default" spellcheck="false"></label>
    <label><span class="l">Model</span><input id="s-model" spellcheck="false"></label>
    <label><span class="l">API key <button class="i" title="Stays in this browser. Sent only to the endpoint above. There is no Alloy server." type="button">i</button></span><input id="s-key" type="password" autocomplete="off" spellcheck="false"></label>
    <label class="chk"><input type="checkbox" id="s-remember"><span class="l">Remember key on this device</span></label>
    <label><span class="l">Curve detail (segments)</span><input id="s-detail" type="number" min="8" max="160"></label>
    <label><span class="l">Material density g/cm³</span><input id="s-density" type="number" step="0.01"></label>
    <label><span class="l">Print volume X,Y,Z mm</span><input id="s-pv"></label>
    <label class="chk"><input type="checkbox" id="s-sound"><span class="l">Menu sounds</span></label>
    <button class="chip" id="s-ext" type="button">Extensions…</button>
  </div>
  <div class="dact"><button class="btn" id="sclose">Done</button></div>
</dialog>
<dialog id="layersdlg" aria-label="Layers"><h2>Layers</h2><div id="layersbody"></div></dialog>
<dialog id="extdlg" class="sheet"><h2>Settings / Extensions</h2><div id="extbody"></div><div class="dact"><button class="btn" id="extclose">Done</button></div></dialog>
<dialog id="extconsent" class="sheet"><h2>Install package</h2><div id="extc-body"></div><div class="dact"><button class="btn ghost" id="extc-no">Cancel</button><button class="btn" id="extc-ok">Install</button></div></dialog>
<dialog id="remotedlg" class="sheet"><h2>Send to your Alloy Runner</h2><div id="remote-body"></div><div class="dact"><button class="btn ghost" id="remote-no">Cancel: send nothing</button><button class="btn" id="remote-ok">Send and run</button></div></dialog>
<div id="pincard" class="glass" hidden role="dialog" aria-label="Risk flag detail"></div><div id="legend" class="glass" hidden></div><div id="probe" class="glass" hidden role="status"></div>
<script src="app.js"></script>
</body>
</html>
