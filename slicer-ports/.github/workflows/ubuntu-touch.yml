name: Alloy Ubuntu Touch (preparation and inspection companion)

# Evidence class for every job below: CI-LANE-WRITTEN (no run seen yet; the commands in the core and ui-smoke
# jobs were run locally in the authoring container on Ubuntu 24.04 / Qt 5.15.13 and passed there).
# OWNER DIRECTIVE 2026-11-17: Ubuntu Touch click builds happen on GitHub Actions (ubuntu + Clickable).
# No signing material is involved: OpenStore re-signs on upload, and nothing here holds a secret.
# The click-build jobs need Docker (present on ubuntu-latest) and pull Clickable's ubuntu-sdk-20.04 images.

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
    tags: ['ut-v*']
    paths: ['ubuntu-touch/**', 'ios/AlloyCore/Tests/AlloyCoreTests/Fixtures/**', 'app/src/main/java/com/mbaliga/alloy/GcodeSafetyValidator.java', 'app/src/main/java/com/mbaliga/alloy/PlateArrangementPlanner.java', '.github/workflows/ubuntu-touch.yml']
  pull_request:
    paths: ['ubuntu-touch/**', 'ios/AlloyCore/Tests/AlloyCoreTests/Fixtures/**', 'app/src/main/java/com/mbaliga/alloy/GcodeSafetyValidator.java', 'app/src/main/java/com/mbaliga/alloy/PlateArrangementPlanner.java', '.github/workflows/ubuntu-touch.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-touch-${{ github.ref }}
  cancel-in-progress: true

env:
  CLICKABLE_VERSION: '8.10.0'

jobs:
  core:
    name: C++ core tests (unit + Java parity), plain and ASan/UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test (Release)
        run: |
          set -eu
          cmake -S ubuntu-touch/core -B build/core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core -j"$(nproc)"
          ctest --test-dir build/core --output-on-failure
      - name: Build and test (Debug, AddressSanitizer + UBSan)
        run: |
          set -eu
          cmake -S ubuntu-touch/core -B build/san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined"
          cmake --build build/san -j"$(nproc)"
          ctest --test-dir build/san --output-on-failure

  parity-vs-java:
    name: Regenerate Java golden corpora and require no diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Regenerate with the real Java sources (JDK 17 and python3 are preinstalled)
        run: sh ios/parity/regen.sh
      - name: Goldens must be unchanged, so the C++ and Swift ports test against current Java
        run: git diff --exit-code -- ios/AlloyCore/Tests/AlloyCoreTests/Fixtures

  ui-smoke:
    name: Qt 5.15 UI smoke test (offscreen) and click layout check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Qt 5.15 (same major.minor as ubuntu-sdk-20.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ qtbase5-dev qtdeclarative5-dev \
            qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-layouts \
            qml-module-qtquick-window2 qml-module-qtquick-templates2 qml-module-qttest
      - name: qmllint (syntax)
        run: qmllint ubuntu-touch/qml/*.qml
      - name: Build app and smoke test
        run: |
          set -eu
          cmake -S ubuntu-touch -B build/ut -DALLOY_BUILD_UI_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/.
          cmake --build build/ut -j"$(nproc)"
      - name: Run the smoke test (software scene graph, offscreen)
        env:
          ALLOY_SMOKE_OUT: ${{ github.workspace }}/smoke-shots
        run: |
          mkdir -p "$ALLOY_SMOKE_OUT"
          for i in 1 2 3; do QT_QPA_PLATFORM=offscreen build/ut/alloy_ui_smoke; done
      - name: Install into a click staging directory and check its layout
        run: |
          set -eu
          # Absolute --prefix instead of DESTDIR + the configure-time prefix /. : cmake 4.2.3 on the ubuntu-26.04
          # runner failed with "file INSTALL given no DESTINATION" on the latter (not reproducible with 3.28/4.2.3 pip builds).
          cmake --install build/ut --prefix "$PWD/stage"
          python3 ubuntu-touch/tools/check_click_layout.py stage --arch amd64
      - name: Upload screenshots (diagnostic; quota-limited so never fails the job)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: alloy-ut-smoke-screenshots
          path: smoke-shots/*.png
          retention-days: 7

  clickable:
    name: Click package (${{ matrix.arch }}) via Clickable
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [core, ui-smoke]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf, amd64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Clickable (pinned)
        run: python3 -m pip install --user "clickable-ut==${CLICKABLE_VERSION}" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the click
        working-directory: ubuntu-touch
        run: clickable build --arch ${{ matrix.arch }} --non-interactive --skip-review --output "$GITHUB_WORKSPACE/click-out"
      - name: Review the click (click-review; informational until the owner has seen a green run)
        working-directory: ubuntu-touch
        continue-on-error: true
        run: clickable review --arch ${{ matrix.arch }} --non-interactive
      - name: List output
        run: ls -l click-out
      - name: Upload click (tags and manual runs only; artifact quota is limited)
        if: startsWith(github.ref, 'refs/tags/ut-v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alloy-click-${{ matrix.arch }}
          path: click-out/*.click
          retention-days: 14

  draft-release:
    name: Draft GitHub release with the click files (tags only)
    if: startsWith(github.ref, 'refs/tags/ut-v')
    needs: [clickable]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job, only to create a DRAFT release; nothing is published or sent to OpenStore
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: alloy-click-*
          merge-multiple: true
          path: click-out
      - name: Create draft release (the owner publishes and uploads to OpenStore by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" click-out/*.click --draft --repo "$GITHUB_REPOSITORY" \
            --title "Alloy for Ubuntu Touch $GITHUB_REF_NAME" \
            --notes "Preparation and inspection companion, not a slicer. Not verified on a device; see ubuntu-touch/OWNER_VERIFY.md."
